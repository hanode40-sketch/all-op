<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المخالفات — Northwest Bus</title>
<script src="https://hanode40-sketch.github.io/all-op/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:var(--nw-bg,#eef2f8);--card:var(--nw-card,#fff);--ink:var(--nw-ink,#0f1e3d);--muted:var(--nw-muted,#64748b);--line:var(--nw-line,#e2e8f0);
--soft:var(--nw-soft,#f6f8fc);--brand:var(--nw-brand,#1f3f7a);--acc:var(--nw-acc,#f97316);--ok:var(--nw-ok,#16a34a);--warn:var(--nw-warn,#d97706);--bad:var(--nw-bad,#dc2626);
--r:14px;--sh:var(--nw-shadow,0 4px 16px rgba(15,30,61,.06))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--nw-font,Tahoma,Arial,sans-serif)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
  background:rgba(31,63,122,.93);color:#fff;border-radius:0 0 16px 16px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.top h1{margin:0;font-size:19px}.top small{display:block;opacity:.8;font-size:12px}
.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.16);padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap}
.wrap{max-width:1400px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:600;position:relative}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab.on .pill{color:var(--ink)}
.tab .bd{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;margin-inline-start:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}.card h3{margin:14px 0 8px;font-size:14px;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:180px}
input[type=text],input[type=search],input[type=number],input[type=month],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--warn)}.btn.acc{background:var(--acc)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--soft);position:sticky;top:0;text-align:right;font-weight:700;color:var(--muted);font-size:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.tbl td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);border:1px solid var(--line)}
.p-ok{background:#e7f6ec;color:#166534;border-color:#bbe5c8}.p-bad{background:#fdecec;color:#991b1b;border-color:#f6c5c5}
.p-warn{background:#fff4e0;color:#92400e;border-color:#f6d9a8}.p-info{background:#e8f0fd;color:#1e40af;border-color:#c7d7f7}
html[data-theme=dark] .p-ok{background:#12301e;color:#86efac}html[data-theme=dark] .p-bad{background:#3a1515;color:#fca5a5}
html[data-theme=dark] .p-warn{background:#3a2a10;color:#fcd34d}html[data-theme=dark] .p-info{background:#132a50;color:#93c5fd}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--muted);font-size:12.5px}
.bars .b{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.bars .b i{display:block;height:14px;background:var(--brand);border-radius:6px;min-width:2px}
.bars .b span:first-child{width:90px;flex-shrink:0;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}.bad{color:var(--bad)}.okc{color:var(--ok)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
.modal .box{background:var(--card);border-radius:16px;max-width:980px;width:100%;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.modal .hd h2{margin:0;font-size:17px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;margin-bottom:10px}
.kv div{border-bottom:1px dashed var(--line);padding:4px 0}.kv b{color:var(--muted);font-weight:600;font-size:12px;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f1e3d;color:#fff;padding:10px 18px;border-radius:12px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:#991b1b}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 9px;background:var(--soft);cursor:pointer;font-size:12.5px}
.chk input{margin:0}
.loader{padding:40px;text-align:center;color:var(--muted)}
.hist{border-inline-start:3px solid var(--line);padding-inline-start:10px;margin:6px 0}
.hist div{margin:4px 0;font-size:12.5px}
.files a{display:inline-block;margin:3px 6px 3px 0}
.sel{background:#fff8ec!important}
html[data-theme=dark] .sel{background:#2b2210!important}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
#pdfStage{position:fixed;left:-20000px;top:0}
.pf{width:1123px;height:794px;background:#fff;color:#111;position:relative;font-family:Tahoma,Arial,sans-serif;direction:rtl;overflow:hidden}
.pf .wm{position:absolute;left:50%;top:52%;width:780px;transform:translate(-50%,-50%);opacity:.9}
.pf .logo{position:absolute;left:34px;top:24px;width:150px}
.pf .yr{position:absolute;right:60px;top:52px;font-weight:700;font-size:13px}
.pf .tt{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:21px}
.pf .tt span{border-bottom:2px solid #111;padding:0 22px 4px}
.pf table{position:absolute;left:18px;right:18px;top:122px;width:calc(100% - 36px);border-collapse:collapse;font-size:12px;background:transparent}
.pf th,.pf td{border:1px solid #777;padding:5px 4px;text-align:center;vertical-align:middle}
.pf th{font-weight:700;font-size:11.5px;line-height:1.35}.pf th em{display:block;font-style:normal;font-weight:400;font-family:Georgia,serif;font-size:11px}
.pf td{height:44px}.pf td.d{font-size:11px;text-align:right;line-height:1.35}
.pf tr.tot td{font-weight:700;height:30px;background:rgba(240,240,240,.6)}
.pf .other{position:absolute;right:56px;width:335px;height:160px;border:1px solid #222;background:rgba(255,255,255,.6)}
.pf .other .h{border-bottom:1px solid #222;text-align:center;font-weight:700;font-size:12px;padding:5px}
.pf .other p{margin:16px 12px 0;font-size:19px;font-weight:700}
.pf .finger{position:absolute;right:470px;font-size:19px;font-weight:700}
.pf .signs{position:absolute;right:56px;left:56px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.pf .signs div{position:relative;text-align:center;width:150px}
.pf .signs img{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.pf .foot{position:absolute;left:18px;right:18px;bottom:8px;display:flex;justify-content:space-between;font-size:10.5px;color:#555}
@media print{.top,.tabs,.no-print,.btn{display:none!important}.card{box-shadow:none;border:0}.scroll{max-height:none;overflow:visible;border:0}body{background:#fff}}
@media (max-width:700px){.tbl{font-size:12px}.kv{grid-template-columns:1fr 1fr}}
</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n === '' || n == null) ? '—' : Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const d10 = s => String(s || '').slice(0, 10);
const t5 = s => { s = String(s || ''); const m = s.match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : s; };
const dt = s => String(s || '').replace('T', ' ').slice(0, 16);
const uniq = a => [...new Set(a)];
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }
function pill(text) {
  const cls = /ملغاة|مرفوض|رفض|معترض عليها|غير/.test(text) ? 'p-bad' : /تم التبصيم|مكتمل|معتمد|قائمة|مقبول/.test(text) ? 'p-ok'
    : /بانتظار|قيد|تعديل|أعيد|لم يتم|مسودة/.test(text) ? 'p-warn' : 'p-info';
  return `<span class="pill ${cls}">${esc(text)}</span>`;
}
async function api(action, data) {
  if (/ضع_هنا/.test(API_URL)) throw new Error('لم يُضبط رابط الخادم (API_URL) في الصفحة');
  const body = NWAuth.attach(Object.assign({ action }, data || {}));
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.error === 'AUTH') { NWAuth.relogin(); throw new Error('انتهت الجلسة — سجّل الدخول من جديد'); }
  if (!j.ok) throw new Error(j.message || j.error || 'خطأ');
  return j;
}
function fileToData(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, type: f.type, data: r.result }); r.onerror = rej; r.readAsDataURL(f); }); }
async function readFiles(input) {
  const out = [];
  for (const f of input.files) {
    if (f.size > 12 * 1024 * 1024) throw new Error('الملف ' + f.name + ' أكبر من 12MB');
    if (!/^(image\/|application\/pdf)/.test(f.type)) throw new Error('الملف ' + f.name + ' ليس صورة أو PDF');
    out.push(await fileToData(f));
  }
  return out;
}
async function openFile(id) {
  try {
    const j = await api('file', { id });
    const bin = atob(j.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: j.mime }));
    window.open(url, '_blank');
  } catch (e) { toast(e.message, 1); }
}
function filesHtml(files) {
  if (!files || !files.length) return '<span class="muted small">لا توجد مرفقات</span>';
  return '<span class="files">' + files.map(f => f.id ? `<a href="#" onclick="openFile('${esc(f.id)}');return false">📎 ${esc(f.name || 'ملف')}</a>` : `<span class="small">📝 ${esc(f.note || '')}</span>`).join('') + '</span>';
}
function modal(title, html, wide) {
  const m = document.createElement('div'); m.className = 'modal';

/* ============ نموذج الطلب (إلغاء / تحويل / مستند / تبصيم) ============ */
const REQ_TITLE = { cancel: 'طلب إلغاء مخالفة', transfer: 'طلب تحويل مخالفة لسائق آخر', doc: 'رفع مستند / ملاحظة / تحديث', stamp: 'رفع إثبات التبصيم' };
function reqDialog(type, vnos, after, existing) {
  const vs = vnos.map(vOf).filter(Boolean);
  const d = existing ? existing.data : {};
  const m = modal(REQ_TITLE[type] + (existing ? ' — تعديل' : ''), `
   <div class="note">المخالفات: ${vs.map(v => `<b>${esc(v.vno)}</b>`).join('، ')} — السائق: ${esc(vs[0] ? vs[0].name : '')} (${esc(vs[0] ? vs[0].iqama : '')})</div>
   ${type === 'transfer' ? `<h3>السائق الجديد</h3><div class="row"><input id="ni" class="grow" placeholder="رقم هوية السائق الجديد (10 أرقام)" inputmode="numeric" maxlength="10" value="${esc(d.newIqama || '')}">
     <input id="nn" class="grow" placeholder="اسم السائق الجديد" value="${esc(d.newName || '')}"></div><div class="small muted" id="nh"></div>` : ''}
   <h3>${type === 'stamp' ? 'ملاحظة (اختياري)' : type === 'doc' ? 'الملاحظة / التحديث' : 'السبب'}</h3>
   <textarea id="rr" placeholder="${type === 'cancel' ? 'لماذا تُلغى المخالفة؟' : type === 'transfer' ? 'لماذا تُحوّل؟ (مثال: السائق المسجل كان في إجازة والمتسبب الفعلي فلان)' : ''}">${esc(d.reason || '')}</textarea>
   <h3>${type === 'stamp' ? 'صورة / ملف إثبات التبصيم (إلزامي)' : 'الإثباتات والمرفقات'}</h3>
   ${existing && (d.files || []).length ? `<div class="chips">${d.files.map(f => `<label class="chk"><input type="checkbox" data-k="${esc(f.id)}" checked> ${esc(f.name)}</label>`).join('')}</div>` : ''}
   <input type="file" id="rf" multiple accept="image/*,application/pdf" ${type === 'stamp' ? 'capture="environment"' : ''}>
   <p class="small muted">الطلب لا يُنفّذ بمجرد رفعه — ينتقل للمشرف للمراجعة والاعتماد.</p>
   <div class="row">${existing ? '' : '<button class="btn sec" id="rd">حفظ كمسودة</button>'}<button class="btn" id="rs">${existing ? 'إعادة التقديم' : 'تقديم للمراجعة'}</button></div>`);
  if (type === 'transfer') {
    const ni = m.querySelector('#ni'), nn = m.querySelector('#nn');
    ni.oninput = () => { const iq = ni.value.replace(/\D/g, ''); ni.value = iq; const p = S.phones[iq]; const known = S.V.find(v => String(v.iqama) === iq);
      const nm = (p && p.name) || (known && known.name) || ''; if (nm && !nn.value) nn.value = nm; m.querySelector('#nh').textContent = nm ? '✓ ' + nm : ''; };
  }
  const send = async (draft, btn) => busy(btn, async () => {
    const data = { reason: m.querySelector('#rr').value.trim(), newFiles: await readFiles(m.querySelector('#rf')) };
    if (type === 'transfer') { data.newIqama = m.querySelector('#ni').value.trim(); data.newName = m.querySelector('#nn').value.trim(); }
    if (existing) { data.keepFiles = [...m.querySelectorAll('[data-k]:checked')].map(c => c.dataset.k); await api('reqUpdate', { id: existing.id, data }); }
    else await api('reqCreate', { type, vnos, data, draft });
    toast(draft ? 'حُفظت المسودة' : 'تم تقديم الطلب للمراجعة'); m.remove(); after && after(); await reloadAll();
  });
  const rd = m.querySelector('#rd'); if (rd) rd.onclick = e => send(true, e.target);
  m.querySelector('#rs').onclick = e => send(false, e.target);
}

/* ============ الطلبات والمراجعة ============ */
function vReqs(m) {
  const me = S.me.u;
  const groups = {
    mine: { ar: 'طلباتي', list: S.R.filter(r => r.createdBy === me) },
    review: { ar: 'بانتظار مراجعتي', list: S.R.filter(r => OPEN.indexOf(r.status) > -1 && canReview(r) && r.createdBy !== me && r.type !== 'objection') },
    objs: { ar: 'اعتراضات السائقين', list: S.R.filter(r => r.type === 'objection' && canReview(r)) },
    done: { ar: 'المقبولة والمرفوضة', list: S.R.filter(r => canReview(r) && ['مكتمل', 'معتمد', 'مرفوض', 'يحتاج إلى تعديل'].indexOf(r.status) > -1) }
  };
  S.rq = S.rq && groups[S.rq] ? S.rq : (groups.review.list.length ? 'review' : 'mine');
  m.innerHTML = `<div class="card"><div class="row">${Object.keys(groups).filter(k => k === 'mine' || groups[k].list.length || k === 'review' && canAny('stampApprove', 'cancelApprove', 'transferApprove', 'docsApprove') || k === 'objs' && canAny('cancelApprove', 'transferApprove'))
     .map(k => `<button class="tab ${S.rq === k ? 'on' : ''}" data-g="${k}">${groups[k].ar} <span class="pill">${groups[k].list.filter(r => k === 'done' || k === 'mine' || OPEN.indexOf(r.status) > -1).length}</span></button>`).join('')}
     <span class="grow"></span><button class="btn sec sm" id="rl">↻ تحديث</button></div></div><div class="card" id="rq"></div>`;
  m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.rq = b.dataset.g; vReqs(m); });
  $('rl').onclick = e => busy(e.target, reloadAll);

  $('rq').innerHTML = !list.length ? '<div class="empty">لا توجد طلبات</div>' : `<div class="scroll"><table class="tbl"><thead><tr><th>رقم الطلب</th><th>النوع</th><th>المخالفات</th><th>السائق</th><th>الحالة</th><th>مقدم الطلب</th><th>التاريخ</th><th>المراجع</th><th>ملاحظة المراجع</th></tr></thead><tbody>
   ${list.map(r => `<tr class="click" data-r="${esc(r.id)}"><td class="n">${esc(r.id)}</td><td>${esc(r.typeName)}</td><td class="n">${esc(String(r.vnos).split(',').join('، '))}</td><td>${esc(r.driverName)}</td>
     <td>${pill(r.status)}</td><td>${esc(r.createdByName)}</td><td class="n">${esc(dt(r.createdAt))}</td><td>${esc(r.reviewerName || '—')}</td><td class="small">${esc(r.reviewNote || '')}</td></tr>`).join('')}</tbody></table></div>`;
}
function showRequest(id) {
  const r = S.R.find(x => x.id === id); if (!r) return toast('الطلب غير متاح لحسابك', 1);

   <div class="kv"><div><b>الحالة</b>${pill(r.status)}</div><div><b>مقدم الطلب</b>${esc(r.createdByName)} — ${esc(dt(r.createdAt))}</div>
    <div><b>السائق</b>${esc(r.driverName)} (${esc(r.iqama)})</div>${r.reviewerName ? `<div><b>المراجع</b>${esc(r.reviewerName)} ${r.reviewedAt ? '— ' + esc(dt(r.reviewedAt)) : ''}</div>` : ''}
    ${r.type === 'transfer' || d.newIqama ? `<div><b>السائق الجديد</b>${esc(d.newName || '')} (${esc(d.newIqama || '')})</div>` : ''}
    ${d.otherName || d.otherId ? `<div><b>المتسبب حسب السائق</b>${esc(d.otherName || '')} ${esc(d.otherId || '')}</div>` : ''}
    ${r.reviewNote ? `<div><b>ملاحظة المراجع / سبب الرفض</b><span class="bad">${esc(r.reviewNote)}</span></div>` : ''}</div>
   <div class="note"><b>${r.type === 'objection' ? 'سبب الاعتراض' : 'السبب / الملاحظة'}:</b> ${esc(d.reason || '—')}</div>
   <h3>المرفقات</h3>${filesHtml(d.files)}
   <h3>المخالفات</h3>${vTable(vs.filter(v => v.iqama !== undefined))}
   <h3>سجل الطلب</h3><div class="hist">${(r.history || []).map(h => `<div>${esc(dt(h.at))} — ${pill(h.status)} — ${esc(h.n)} ${h.note ? '— ' + esc(h.note) : ''}</div>`).join('')}</div>
   <div class="row" style="margin-top:12px" id="ra"></div>`, true);
  bindTable(m);
  const ra = m.querySelector('#ra'); const btns = [];
  if (mine && ['مسودة', 'مرفوض', 'يحتاج إلى تعديل'].indexOf(r.status) > -1 && r.type !== 'objection' && can(REQ_PERM[r.type][0]))
    btns.push(`<button class="btn" data-x="edit">✏️ تعديل وإعادة التقديم</button>`);
  if (open && mine && !canReview(r)) btns.push('<span class="small muted">بانتظار مراجعة المشرف</span>');
  if (open && mine && canReview(r)) btns.push('<span class="small muted">طلبك الشخصي يُحال للمدير أو مراجع آخر مخوّل — لا يمكنك اعتماده بنفسك.</span>');
  if (reviewable) {
    if (r.status !== 'قيد المراجعة') btns.push(`<button class="btn sec" data-x="claim">بدء المراجعة</button>`);
    if (r.type === 'objection') {
      btns.push(`<div class="grow"><textarea id="rn" placeholder="ملاحظة المراجع (إلزامية عند الرفض)"></textarea>
       <div class="row">${can('cancelApprove') ? '<button class="btn ok" data-x="o-cancel">قبول الاعتراض وإلغاء المخالفة</button>' : ''}
       ${can('transferApprove') ? '<button class="btn warn" data-x="o-transfer">قبول وتحويلها لسائق آخر</button>' : ''}
       <button class="btn sec" data-x="o-keep">قبول بدون تغيير</button><button class="btn bad" data-x="reject">رفض الاعتراض</button></div></div>`);
    } else {
      btns.push(`<div class="grow"><textarea id="rn" placeholder="ملاحظة المراجع (إلزامية عند الرفض أو طلب التعديل)"></textarea>
       <div class="row"><button class="btn ok" data-x="approve">✓ اعتماد وتنفيذ</button><button class="btn warn" data-x="needs">يحتاج إلى تعديل</button><button class="btn bad" data-x="reject">✗ رفض</button></div></div>`);
    }
  }
  ra.innerHTML = btns.join('');
  ra.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
    const x = b.dataset.x, note = (m.querySelector('#rn') || {}).value || '';
    if (x === 'edit') { m.remove(); return reqDialog(r.type, String(r.vnos).split(','), null, r); }
    if (x === 'claim') return busy(b, async () => { await api('reqClaim', { id: r.id }); await loadReqs(); m.remove(); showRequest(r.id); render(); });
    if (x === 'o-transfer') {
      const iq = prompt('رقم هوية السائق المتسبب (الجديد):', d.otherId || ''); if (!iq) return;
      const nm = prompt('اسم السائق الجديد:', d.otherName || (S.phones[iq] || {}).name || ''); if (!nm) return;
      return busy(b, async () => { await api('reqReview', { id: r.id, decision: 'approve', outcome: 'transfer', newIqama: iq.trim(), newName: nm.trim(), note }); toast('تم'); m.remove(); await reloadAll(); });
    }
    const body = x.startsWith('o-') ? { decision: 'approve', outcome: x.slice(2) } : { decision: x };
    if ((x === 'reject' || x === 'needs') && !note.trim()) return toast('اكتب السبب في خانة الملاحظة', 1);
    if (x === 'approve' && !confirm('اعتماد الطلب وتنفيذ الإجراء؟')) return;
    busy(b, async () => { await api('reqReview', Object.assign({ id: r.id, note }, body)); toast('تم حفظ القرار'); m.remove(); await reloadAll(); });
  });
}

  const fin = can('finance');
  const go = () => {

     ${l.slice(0, 800).map(d => { const p = S.phones[d.iqama] || {}; return `<tr class="click" data-d="${esc(d.iqama)}"><td>${esc(d.name)}</td><td class="n">${esc(d.iqama)}</td><td class="n">${esc(p.mob || '—')}</td><td>${esc(p.garage || '')}</td>
      <td>${d.open}</td><td>${d.unstamped}</td><td>${d.list.filter(v => v.status !== 'ملغاة' && !(v.sendCount > 0)).length}</td>${fin ? `<td class="n">${money(d.total)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;

   <div class="row" style="margin:8px 0">
    ${can('print') ? '<button class="btn sec" data-k="print" disabled>🖨️ طباعة كشف PDF</button>' : ''}
    ${can('stamp') ? '<button class="btn" data-k="stampForm" disabled>🖐️ نموذج تبصيم PDF</button><button class="btn" data-k="stampUp" disabled>📤 رفع إثبات التبصيم</button>' : ''}
    ${can('whatsapp') ? '<button class="btn ok" data-k="wa" disabled>📲 إرسال واتساب</button>' : ''}
    ${can('cancelReq') ? '<button class="btn bad sm" data-k="cancel" disabled>طلب إلغاء</button>' : ''}
    ${can('transferReq') ? '<button class="btn warn sm" data-k="transfer" disabled>طلب تحويل</button>' : ''}
   </div>
   <div id="dv">${vTable(d.list.filter(v => v.status !== 'ملغاة'), { sel: true })}</div>
   <h3>سجل الإرسال والطباعة</h3><div id="dlog" class="small muted">…</div>
   <h3>الطلبات</h3>${reqMini(S.R.filter(r => String(r.iqama) === d.iqama)) }`, true);
  const upd = sel => {

    m.querySelectorAll('[data-k]').forEach(b => b.disabled = !sel.length);
  };
  bindTable(m.querySelector('#dv'), upd);
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const sel = selected(m.querySelector('#dv')); const k = b.dataset.k;
    if (k === 'print' || k === 'stampForm') return busy(b, () => makeProof(d, sel, k === 'stampForm' ? 'stamp' : 'print'));
    if (k === 'stampUp') return reqDialog('stamp', sel, () => m.remove());
    if (k === 'wa') return waDialog(d, sel, m);
    reqDialog(k, sel, () => m.remove());
  });
  try {
    const [s, pr] = await Promise.all([api('sends', { iqama: d.iqama }), api('prints', { iqama: d.iqama })]);
    const items = s.items.map(x => ({ at: x.at, t: `📲 إرسال واتساب إلى ${x.phone} — ${String(x.vnos).split(',').length} مخالفة — ${x.byName}` + (x.pdfUrl ? ` — <a href="${esc(x.pdfUrl)}" target="_blank">الكشف</a>` : '') }))
      .concat(pr.items.map(x => ({ at: x.at, t: `${x.kind === 'stamp' ? '🖐️ نموذج تبصيم' : '🖨️ طباعة كشف'} — ${String(x.vnos).split(',').length} مخالفة — ${esc(x.byName)}` })))
      .sort((a, b) => String(b.at).localeCompare(String(a.at)));
    m.querySelector('#dlog').innerHTML = items.length ? items.map(i => `<div>${esc(dt(i.at))} — ${i.t}</div>`).join('') : 'لا يوجد';
  } catch (e) { m.querySelector('#dlog').textContent = e.message; }
}

/* ---------- نموذج «إثبات مخالفة مرورية» (PDF) ---------- */
function proofPages(d, vs, ref) {
  const PER = 9, BOX = 5;
  const chunks = []; for (let i = 0; i < vs.length; i += PER) chunks.push(vs.slice(i, i + PER));
  if (!chunks.length) chunks.push([]);
  const needExtra = chunks[chunks.length - 1].length > BOX;
  const total = vs.reduce((s, v) => s + Number(v.amount || 0), 0);
  const year = new Date().getFullYear(); const today = new Date().toLocaleDateString('en-GB');
  const pages = []; const nPages = chunks.length + (needExtra ? 1 : 0);
  const head = `<tr><th style="width:26px">م</th><th>رقم المخالفة<em>Violation number</em></th><th>رقم هوية المخالف<em>Violator's ID number</em></th><th style="width:150px">الاسم<em>Name</em></th>
   <th style="width:230px">تفاصيل المخالفة<em>Details of the violation</em></th><th>مدينة المخالفة<em>City where the violation occurred</em></th><th>تاريخ المخالفة<em>Date of violation</em></th>
   <th>الوقت<em>Time of violation</em></th><th>رقم التشغيل<em>Operating number</em></th><th>المبلغ<em>Fine amount</em></th></tr>`;
  let idx = 0;
  const bottom = top => `<div class="other" style="top:${top}px"><div class="h">في حال كان المتسبب سائق اخر</div><p>اسم السائق:</p><p style="margin-top:30px">الهوية :</p></div>
    <div class="finger" style="top:${top + 92}px">البصمة</div>
    <div class="signs" style="top:${top + 200}px"><div>مدير قسم المخالفات<img src="${ASSETS.sig1}" style="width:95px;top:-40px"></div>
     <div>مشرف التشغيل<img src="${ASSETS.sig2}" style="width:150px;top:-26px"></div><div>مدير التشغيل</div><div>الموارد البشرية</div><div>المدير المالي</div></div>`;
  const pageHtml = (rows, showTotal, showBox, withTable, pi) => {
    const tableH = withTable ? 122 + 52 + rows.length * 46 + (showTotal ? 32 : 0) : 120;
    return `<div class="pf"><img class="wm" src="${ASSETS.wm}"><img class="logo" src="${ASSETS.logo}"><div class="yr">${year}</div><div class="tt"><span>اثبات مخالفة مرورية</span></div>
     ${withTable ? `<table>${head}${rows.map(v => `<tr><td>${++idx}</td><td>${esc(v.vno)}</td><td>${esc(v.iqama)}</td><td>${esc(v.name)}</td><td class="d">${esc(v.descAr)}</td>
       <td>${esc(v.city)}</td><td>${esc(d10(v.dateG))}</td><td>${esc(t5(v.time))}</td><td>${esc(v.opNo)}</td><td>${money(v.amount)}</td></tr>`).join('')}
       ${showTotal ? `<tr class="tot"><td colspan="9">الإجمالي — ${vs.length} مخالفة</td><td>${money(total)}</td></tr>` : ''}</table>` : ''}
     ${showBox ? bottom(Math.max(tableH + 22, 300)) : ''}
     <div class="foot"><span>رقم الكشف: ${esc(ref)} — ${esc(d.name)} (${esc(d.iqama)})</span><span>تاريخ الإصدار: ${today}</span><span>صفحة ${pi} من ${nPages}</span></div></div>`;
  };
  chunks.forEach((c, i) => { const last = i === chunks.length - 1; pages.push(pageHtml(c, last, last && !needExtra, true, i + 1)); });
  if (needExtra) pages.push(pageHtml([], false, true, false, nPages));

}
async function proofPdf(d, vs, ref) {
  if (!window.html2canvas || !window.jspdf) throw new Error('مكتبات PDF لم تُحمّل — تأكد من الاتصال بالإنترنت');
  const st = $('pdfStage'); const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const pages = proofPages(d, vs, ref);
  for (let i = 0; i < pages.length; i++) {
    st.innerHTML = pages[i];
    await Promise.all([...st.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const c = await html2canvas(st.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });
    if (i) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 841.89, 595.28);

}
async function makeProof(d, sel, kind) {

function waPhone(p) {
  p = String(p || '').replace(/[^\d+]/g, '');
  if (p.startsWith('+')) return p.slice(1);
  if (p.startsWith('00')) return p.slice(2);
  if (/^05\d{8}$/.test(p)) return '966' + p.slice(1);
  if (/^5\d{8}$/.test(p)) return '966' + p;
  return p;
}
function waText(d, vs, pdfUrl, objUrl, deadline) {
  const tot = vs.reduce((s, v) => s + Number(v.amount || 0), 0);
  const lines = vs.map((v, i) => `${i + 1}) ${v.vno} — ${v.descAr} — ${d10(v.dateG)} — ${money(v.amount)} ريال`);
  const dl = dt(deadline);

${lines.join('\n')}

📄 نموذج إثبات المخالفة: ${pdfUrl}

في حال وجود اعتراض يرجى تقديمه خلال ${S.objHours} ساعة (حتى ${dl}) عبر الرابط:
${objUrl}
*وفي حال عدم الاعتراض خلال المدة المحددة تُعتبر المخالفة ثابتة بحقك.*

Dear ${d.name}, ${vs.length} traffic violation(s) totaling ${money(tot)} SAR have been recorded against you (details in the PDF above).
To object, submit within ${S.objHours} hours via the link above. If no objection is received within this period, the violation will be considered confirmed.
— Northwest Bus`;
}

function cellVal(c) {

    return v.getUTCFullYear() < 1901 ? iso.slice(11, 16) : iso.slice(0, 10) + (iso.slice(11, 16) !== '00:00' ? ' ' + iso.slice(11, 16) : '');

  return String(v).replace(/ /g, ' ').trim();

    if (g === 'year') std('السنة', agg(v => String(v.month).slice(0, 4)).sort((x, y) => x.k.localeCompare(y.k)));
    if (g === 'driver') std('السائق', agg(v => v.name + ' — ' + v.iqama).sort((x, y) => y.n - x.n));
    if (g === 'opNo') std('رقم التشغيل', agg(v => v.opNo).sort((x, y) => y.n - x.n));
    if (g === 'plate') std('اللوحة', agg(v => v.plate).sort((x, y) => y.n - x.n));
    if (g === 'city') std('المدينة', agg(v => v.city).sort((x, y) => y.n - x.n));
    if (g === 'type') std('المخالفة', agg(v => (v.descAr || v.descEn)).sort((x, y) => y.n - x.n));
    if (g === 'stamp') std('حالة التبصيم', agg(v => v.status === 'ملغاة' ? 'ملغاة' : (v.stamp || 'لم يتم التبصيم')));
    if (g === 'status') std('الحالة', agg(v => v.status === 'ملغاة' ? 'ملغاة' : v.transferredFrom ? 'محوّلة' : v.objection ? 'معترض عليها / ' + v.objection : OPEN_V(v) ? 'عليها طلب معلّق' : 'قائمة'));
    if (g === 'sent') std('الإرسال', agg(v => v.sendCount > 0 ? 'أُرسلت (' + (v.sendCount > 1 ? 'أكثر من مرة' : 'مرة') + ')' : 'لم تُرسل'));
    if (g === 'reqs') { const o = {}; S.R.forEach(r => { const k = r.typeName; const x = o[k] || (o[k] = { k, n: 0 }); x.n++; x[r.status] = (x[r.status] || 0) + 1; });
      const sts = ['مسودة', 'بانتظار مراجعة المشرف', 'قيد المراجعة', 'أعيد تقديمه', 'يحتاج إلى تعديل', 'مرفوض', 'مكتمل'];
      cols = ['نوع الطلب', 'الإجمالي', ...sts]; rows = Object.values(o).map(x => [x.k, x.n, ...sts.map(s => x[s] || 0)]); title = 'الطلبات (كل الفترات المتاحة لحسابك)'; }
    if (g === 'staff') { const o = {}; const add = (u, n, f) => { const x = o[u] || (o[u] = { n, sub: 0, rev: 0, ok: 0, rej: 0 }); x[f]++; };
      S.R.forEach(r => { if (!String(r.createdBy).startsWith('driver:')) add(r.createdBy, r.createdByName, 'sub');
        (r.history || []).forEach(h => { if (h.status === 'معتمد') { add(h.u, h.n, 'rev'); add(h.u, h.n, 'ok'); } if (h.status === 'مرفوض' || h.status === 'يحتاج إلى تعديل') { add(h.u, h.n, 'rev'); add(h.u, h.n, 'rej'); } }); });
      cols = ['المستخدم', 'طلبات قدّمها', 'طلبات راجعها', 'اعتمدها', 'رفضها / أعادها']; rows = Object.values(o).map(x => [x.n, x.sub, x.rev, x.ok, x.rej]).sort((p, q) => (q[1] + q[2]) - (p[1] + p[2])); title = 'أداء الموظفين والمشرفين (الطلبات)'; }
    if (rows.length && typeof rows[0][1] === 'number') { const tot = cols.map((c, i) => i === 0 ? 'الإجمالي' : rows.reduce((s, r) => s + (typeof r[i] === 'number' ? r[i] : 0), 0)); rows.push(tot); }
    S.rep = { title, cols, rows };
    $('rout').innerHTML = `<h2>${esc(title)}</h2>${!rows.length ? '<div class="empty">لا توجد بيانات</div>' : `<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map((r, i) => `<tr ${i === rows.length - 1 && r[0] === 'الإجمالي' ? 'style="font-weight:700"' : ''}>${r.map(c => `<td class="${typeof c === 'number' ? 'n' : ''}">${typeof c === 'number' ? money(c) : esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}`;
  };
  ['r1', 'r2', 'rg'].forEach(id => $(id).onchange = go); go();
  $('rx').onclick = () => exportXlsx(S.rep.title, S.rep.cols.map((c, i) => [c, r => r[i]]), S.rep.rows);
  $('rp').onclick = () => window.print();
}
const OPEN_V = v => S.R.some(r => OPEN.indexOf(r.status) > -1 && String(r.vnos).split(',').indexOf(String(v.vno)) > -1);
async function exportXlsx(title, cols, list) {
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('تقرير', { views: [{ rightToLeft: true }] });
  ws.addRow([title]).font = { bold: true, size: 14 };
  const h = ws.addRow(cols.map(c => c[0])); h.font = { bold: true, color: { argb: 'FFFFFFFF' } };
  h.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F2D4D' } });
  list.forEach(r => ws.addRow(cols.map(([, k]) => typeof k === 'function' ? k(r) : r[k])));
  ws.columns.forEach(c => c.width = 18);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf])); a.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.xlsx'; a.click();
}

/* ============ الأرشيف ============ */
function vArchive(m) {
  m.innerHTML = `<div class="card"><div class="row"><input id="aq" type="search" class="grow" placeholder="ابحث برقم المخالفة أو السائق أو الهوية أو التاريخ (مثال 2026-03)">
   <select id="af"><option value="">كل المخالفات</option><option value="c">الملغاة</option><option value="t">المحوّلة</option><option value="d">التي لها مستندات</option></select></div></div>
   <div class="card" id="ar"></div><div class="card"><h2>سجل الإرسال عبر واتساب</h2><div id="as" class="loader">…</div></div>`;
  const go = () => {
    const q = $('aq').value.trim(); const f = $('af').value;
    let l = S.V.filter(v => !q || [v.vno, v.iqama, v.name, v.dateG, v.month, v.plate].join(' ').toLowerCase().indexOf(q.toLowerCase()) > -1);
    if (f === 'c') l = l.filter(v => v.status === 'ملغاة'); if (f === 't') l = l.filter(v => v.transferredFrom); if (f === 'd') l = l.filter(v => (v.docs || []).length);
    $('ar').innerHTML = `<div class="small muted">${l.length} سجل</div>` + vTable(l, { max: 1000 }); bindTable($('ar'));
  };
  $('aq').oninput = go; $('af').onchange = go; go();
  api('sends').then(j => { $('as').innerHTML = !j.items.length ? '<div class="empty">لا يوجد</div>' : `<div class="scroll" style="max-height:40vh"><table class="tbl"><thead><tr><th>التاريخ</th><th>السائق</th><th>الجوال</th><th>عدد المخالفات</th><th>بواسطة</th><th>مهلة الاعتراض</th><th>الكشف</th></tr></thead><tbody>
    ${j.items.map(s => `<tr><td class="n">${esc(dt(s.at))}</td><td>${esc(s.name)}</td><td class="n">${esc(s.phone)}</td><td>${String(s.vnos).split(',').length}</td><td>${esc(s.byName)}</td><td class="n">${esc(dt(s.objDeadline))}</td><td>${s.pdfUrl ? `<a href="${esc(s.pdfUrl)}" target="_blank">فتح</a>` : ''}</td></tr>`).join('')}</tbody></table></div>`; })
    .catch(e => $('as').textContent = e.message);
}

/* ============ المستخدمون والصلاحيات ============ */
async function vUsers(m) {
  m.innerHTML = '<div class="loader">…</div>';
  let j; try { j = await api('users'); } catch (e) { m.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; return; }
  const P = {}; j.perms.forEach(p => P[String(p.username).toLowerCase()] = p);
  const list = j.users.map(u => Object.assign({}, u, { p: P[u.username] })).concat(j.perms.filter(p => !j.users.find(u => u.username === String(p.username).toLowerCase())).map(p => ({ username: p.username, name: p.name, p })));
  m.innerHTML = `<div class="card"><h2>المستخدمون والصلاحيات</h2><p class="small muted">المستخدمون من نظام الدخول الموحّد. كل صلاحية مستقلة وتُفعّل لكل حساب على حدة. صلاحية «استيراد Excel» حصرية للمدير ولا يمكن منحها. صاحب دور «مدير» في الدخول الموحّد مدير هنا تلقائياً.</p>
   <input id="uq" type="search" placeholder="بحث" style="margin-bottom:8px"><div class="scroll"><table class="tbl"><thead><tr><th>المستخدم</th><th>الدور في الدخول</th><th>الدور هنا</th><th>الصلاحيات</th><th></th></tr></thead><tbody id="ub"></tbody></table></div></div>`;
  const draw = () => { const q = $('uq').value.trim().toLowerCase();
    $('ub').innerHTML = list.filter(u => !q || (u.name + ' ' + u.username).toLowerCase().indexOf(q) > -1).map(u => { const p = u.p || {}; const ps = String(p.perms || '').split(',').filter(Boolean);
      return `<tr><td><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.username)}</span>${u.loginActive === false ? ' ' + pill('غير فعّال في الدخول') : ''}</td><td>${esc(u.loginRole || '')}</td>
       <td>${u.loginRole === 'مدير' ? pill('مدير (تلقائي)') : p.role ? pill(p.role + (p.active === 'لا' ? ' — معطّل' : '')) : '<span class="muted small">لا يوجد</span>'}</td>
       <td class="small">${u.loginRole === 'مدير' ? 'كل الصلاحيات' : ps.map(x => PERM_LABEL[x] || x).join('، ') || '—'}</td><td>${u.loginRole === 'مدير' || u.username === S.me.u ? '' : `<button class="btn sm" data-u="${esc(u.username)}">تعديل</button>`}</td></tr>`; }).join('');
    $('ub').querySelectorAll('[data-u]').forEach(b => b.onclick = () => userDlg(list.find(x => x.username === b.dataset.u), j.permKeys));
  };
  $('uq').oninput = draw; draw();
}
function userDlg(u, keys) {
  const p = u.p || {}; const ps = String(p.perms || '').split(',');
  const preset = { 'موظف': ['dashboard', 'view', 'print', 'stamp', 'drivers', 'cancelReq', 'transferReq', 'docs'], 'مشرف': ['dashboard', 'view', 'print', 'drivers', 'archive', 'reports', 'cancelApprove', 'transferApprove', 'stampApprove', 'docsApprove'] };
  const m = modal('صلاحيات — ' + esc(u.name), `<div class="row"><label>الدور <select id="ur"><option>موظف</option><option>مشرف</option><option>مدير</option></select></label>
    <label class="chk"><input type="checkbox" id="ua" ${p.active === 'لا' ? '' : 'checked'}> الحساب مفعّل في نظام المخالفات</label><button class="btn sec sm" id="upre">تعبئة الصلاحيات المقترحة للدور</button></div>
   <h3>الصلاحيات</h3><div class="chips">${keys.filter(k => k !== 'import').map(k => `<label class="chk"><input type="checkbox" data-p="${k}" ${ps.indexOf(k) > -1 ? 'checked' : ''}> ${esc(PERM_LABEL[k] || k)}</label>`).join('')}</div>
   <p class="small muted">الدور «مدير» هنا يعطي كل الصلاحيات الإدارية عدا ما يخص الحساب نفسه. الصلاحيات لا تُمنح تلقائياً للموظف أو المشرف — حدّدها لكل حساب.</p>
   <button class="btn" id="us">حفظ</button>`);
  m.querySelector('#ur').value = p.role || 'موظف';
  m.querySelector('#upre').onclick = () => { const r = m.querySelector('#ur').value; const l = preset[r] || keys; m.querySelectorAll('[data-p]').forEach(c => c.checked = l.indexOf(c.dataset.p) > -1); };
  m.querySelector('#us').onclick = e => busy(e.target, async () => {
    await api('userSave', { username: u.username, name: u.name, role: m.querySelector('#ur').value, active: m.querySelector('#ua').checked, perms: [...m.querySelectorAll('[data-p]:checked')].map(c => c.dataset.p) });
    toast('تم حفظ الصلاحيات'); m.remove(); vUsers($('main'));
  });
}

/* ============ سجل العمليات ============ */
async function vAudit(m) {
  m.innerHTML = `<div class="card"><div class="row"><input id="lq" type="search" class="grow" placeholder="بحث في السجل (مستخدم، رقم مخالفة، إجراء…)"><button class="btn sec" id="lg">بحث</button><button class="btn sec" id="lx">⬇️ Excel</button></div></div><div class="card" id="ll"><div class="loader">…</div></div>`;
  const go = async () => { const j = await api('audit', { q: $('lq').value.trim() }); S.aud = j.items;
    $('ll').innerHTML = !j.items.length ? '<div class="empty">لا يوجد</div>' : `<div class="scroll"><table class="tbl"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>المرجع</th><th>التفاصيل</th></tr></thead><tbody>
     ${j.items.map(a => `<tr><td class="n">${esc(dt(a.at))}</td><td>${esc(a.name)}<br><span class="small muted">${esc(a.username)}</span></td><td>${esc(a.action)}</td><td class="small">${esc(a.ref)}</td><td class="small">${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`; };
  $('lg').onclick = e => busy(e.target, go); $('lq').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('lx').onclick = () => exportXlsx('سجل العمليات', [['الوقت', 'at'], ['المستخدم', 'name'], ['اسم الدخول', 'username'], ['الإجراء', 'action'], ['المرجع', 'ref'], ['التفاصيل', 'details']], S.aud || []);
  go().catch(e => $('ll').textContent = e.message);
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.tab && S.me) { S.tab = h; render(); } });
if (window.NWAuth) boot();
