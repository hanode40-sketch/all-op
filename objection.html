<title>الاعتراض على المخالفة — Violation Objection</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f8;color:#0f1e3d;font:15px/1.6 Tahoma,Arial,sans-serif}
.top{background:linear-gradient(135deg,#13274f,#1f4a8a);color:#fff;padding:16px;text-align:center}
.top img{height:54px;background:#fff;border-radius:10px;padding:4px 8px}
.top h1{margin:8px 0 0;font-size:19px}.top small{opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,30,61,.06)}
.en{direction:ltr;text-align:left;color:#475569;font-size:13px;font-family:Arial,sans-serif}
.v{display:flex;gap:10px;align-items:flex-start;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.v input{width:22px;height:22px;margin-top:3px;flex-shrink:0}
.v.on{border-color:#1f3f7a;background:#f0f5ff}.v.dis{opacity:.55;cursor:default}
.v b{display:block}.v .m{font-size:13px;color:#64748b}
textarea,input[type=text]{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;background:#f8fafc}
textarea{min-height:110px}
label.l{display:block;font-weight:700;margin:12px 0 4px}
.btn{display:block;width:100%;border:0;background:#1f3f7a;color:#fff;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5}
.msg{padding:14px;border-radius:12px;text-align:center}
.ok{background:#e7f6ec;color:#166534}.err{background:#fdecec;color:#991b1b}.warn{background:#fff4e0;color:#92400e}
a{color:#1f3f7a}
</style>

<div class="wrap" id="app"><div class="card msg">جاري التحميل… Loading…</div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyhMGws-oWKytVX3_tG_C9SsEwvf6cyLzCJmuiRpm4OyCS3xYcoFmjFfxuRcOrNDTmxfw/exec';
const T = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action, data) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, t: T }, data || {})) });
  const j = await r.json(); if (!j.ok) throw new Error(j.message || j.error || 'Error'); return j;
}
function fileData(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, type: f.type, data: r.result }); r.onerror = rej; r.readAsDataURL(f); }); }
async function load() {
  let j;
  try { j = await call('objGet'); } catch (e) { app.innerHTML = `<div class="card msg err">⚠️ ${esc(e.message)}<div class="en">This link is invalid.</div></div>`; return; }
  const dl = String(j.deadline || '').replace('T', ' ').slice(0, 16);
  app.innerHTML = `<div class="card"><b>السيد/ ${esc(j.name)}</b>
    <div>${j.open ? `يمكنك تقديم اعتراضك حتى <b>${esc(dl)}</b>. في حال عدم الاعتراض خلال المدة تُعتبر المخالفة ثابتة بحقك.` : '<span class="msg warn" style="display:block">انتهت مهلة الاعتراض على هذه المخالفات.</span>'}</div>
    <div class="en">${j.open ? `You may object until <b>${esc(dl)}</b>. If no objection is received, the violation is considered confirmed.` : 'The objection period has ended.'}</div>
    ${j.pdfUrl ? `<p><a href="${esc(j.pdfUrl)}" target="_blank" rel="noopener">📄 نموذج إثبات المخالفة — View the violation form (PDF)</a></p>` : ''}</div>
   <div class="card"><b>اختر المخالفة التي تعترض عليها</b><div class="en">Select the violation(s) you object to</div>
    ${j.items.map(v => { const dis = !j.open || v.cancelled || v.objected; return `<label class="v ${dis ? 'dis' : ''}"><input type="checkbox" value="${esc(v.vno)}" ${dis ? 'disabled' : ''}>
      <div><b>${esc(v.vno)} — ${esc(v.descAr)}</b><div class="m en">${esc(v.descEn)}</div>
      <div class="m">📍 ${esc(v.city)} · 📅 ${esc(String(v.dateG).slice(0, 10))} ${esc((String(v.time).match(/(\d{1,2}):(\d{2})/) || [''])[0])} · 🚌 ${esc(v.opNo)} · 💰 ${esc(v.amount)} SAR</div>
      ${v.cancelled ? '<div class="m">ملغاة · Cancelled</div>' : v.objected ? '<div class="m">✓ تم تقديم اعتراض · Objection submitted</div>' : ''}</div></label>`; }).join('')}
   </div>
   ${j.open ? `<div class="card">
    <label class="l">سبب الاعتراض · Reason for objection</label><textarea id="r" placeholder="اكتب السبب بالتفصيل — Write the reason in detail"></textarea>
    <label class="l">إذا كان المتسبب سائقاً آخر (اختياري) · If another driver caused it (optional)</label>
    <input type="text" id="on" placeholder="اسم السائق · Driver name"><input type="text" id="oi" inputmode="numeric" maxlength="10" placeholder="رقم الهوية · ID number" style="margin-top:6px">
    <label class="l">صورة أو مستند يدعم الاعتراض (اختياري) · Supporting photo/document (optional)</label><input type="file" id="f" accept="image/*,application/pdf">
    <button class="btn" id="go">إرسال الاعتراض · Submit objection</button><div id="out"></div></div>` : ''}`;
  app.querySelectorAll('.v input').forEach(c => c.onchange = () => c.closest('.v').classList.toggle('on', c.checked));
  const go = document.getElementById('go');
  if (go) go.onclick = async () => {
    const vnos = [...app.querySelectorAll('.v input:checked')].map(c => c.value);
    const out = document.getElementById('out');
    if (!vnos.length) { out.innerHTML = '<div class="msg err">اختر المخالفة · Select a violation</div>'; return; }
    const reason = document.getElementById('r').value.trim();
    if (reason.length < 3) { out.innerHTML = '<div class="msg err">اكتب سبب الاعتراض · Write the reason</div>'; return; }
    go.disabled = true; go.textContent = '…';
    try {
      const f = document.getElementById('f').files[0];
      if (f && f.size > 10 * 1024 * 1024) throw new Error('الملف كبير جداً · File too large');
      await call('objSubmit', { vnos, reason, otherName: document.getElementById('on').value.trim(), otherId: document.getElementById('oi').value.trim(), file: f ? await fileData(f) : null });
      app.innerHTML = '<div class="card msg ok">✅ تم استلام اعتراضك وسيُراجع من الإدارة.<div class="en">Your objection has been received and will be reviewed.</div></div>';
    } catch (e) { out.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; go.disabled = false; go.textContent = 'إرسال الاعتراض · Submit objection'; }
  };
}
