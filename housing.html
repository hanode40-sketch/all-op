<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const DEP = { 'Shumaysi':'الشميسي','Madinah':'المدينة','Tabuk':'تبوك','Riyadh':'الرياض','Jazan':'جازان','Khamis Mushait':'خميس مشيط','Al Bashayer':'البشائر','Buraydah':'بريدة','Hail':'حائل','Unassigned':'غير محدد' };
const ST = {
  'operation':{ar:'على رأس العمل',c:'s-active'}, 'Annual Leave':{ar:'إجازة سنوية',c:'s-leave'}, 'Emergency Leave':{ar:'إجازة اضطرارية',c:'s-leave'}, 'Sick Leave':{ar:'إجازة مرضية',c:'s-leave'},
  'Not Returned':{ar:'لم يعد من الإجازة',c:'s-warn'}, 'Suspended':{ar:'موقوف عن العمل',c:'s-warn'}, 'Absconding':{ar:'هروب',c:'s-out'}, 'Termination of services':{ar:'إنهاء خدمات',c:'s-out'}
};
const OUT = ['Absconding', 'Termination of services'], WARN = ['Not Returned', 'Suspended'], LEAVE = ['Annual Leave', 'Emergency Leave', 'Sick Leave'];
const NEEDS_HOUSE = ['operation', 'Annual Leave', 'Emergency Leave', 'Sick Leave'];
const ERR = { FORBIDDEN:'ما عندك صلاحية لهذي العملية', ROOM_NOT_EMPTY:'الغرفة فيها ساكنين — انقلهم أو أخلهم أول', DUP_ROOM:'الغرفة موجودة بنفس الرقم في نفس الكراج والمبنى',
  BEDS_IN_USE:'فيه سائق على سرير رقمه أكبر من العدد الجديد', BAD_ROOM:'اكتب الكراج ورقم الغرفة وعدد الأسرّة', ROOM_MAINT:'الغرفة تحت صيانة', BAD_BED:'اختر السرير',
  BED_TAKEN:'السرير مشغول', NO_DRIVER:'السائق مو موجود في إدارة السائقين', SAME_BED:'السائق ساكن في نفس السرير', NOT_HOUSED:'السائق مو ساكن', BAD_IQAMA:'اختر السائق',
  NOT_FOUND:'ما لقيت الغرفة', ROOM_TRANSIT:'هذي غرفة ترانزيت — للتسكين الدائم اختر غرفة سكن دائم', ROOM_NOT_TRANSIT:'هذي غرفة سكن دائم مو ترانزيت', AUTH:'انتهت الجلسة — سجّل دخول من جديد', NO_URL:'تعذر الاتصال' };
const RC = { iq:0, name:1, st:2, dep:3, mob:4, nat:5, emp:6, sb:7 };

let D = null, G = 'all', TAB = 'rooms', Q = '', F = 'all', HL = '';
let ROOM = {}, OCC = {}, BYROOM = {}, DRV = {}, TRN = {}, TBY = {};
/* الراحة حسب الروستر: آخر رحلة نفّذها السائق تحدد كراج راحته (نفس منطق إدارة السائقين) */
let TRIP_END = {}, RS = { ok:false, last:{}, today:{}, usual:{}, trips:{} };
const END_DEPOT = [[/jeddah|makkah|mecca|jarwal|yanbu|جدة|مكة|ينبع/i, 'Shumaysi'], [/madinah|medina|rafha|المدينة|رفحاء/i, 'Madinah'], [/tabuk|haql|تبوك|حقل/i, 'Tabuk'],
  [/riyadh|dawadmi|الرياض|الدوادمي/i, 'Riyadh'], [/jazan|jizan|جازان/i, 'Jazan'], [/khamis|خميس/i, 'Khamis Mushait'], [/bashayer|البشائر/i, 'Al Bashayer'],
  [/buraydah|qassim|بريدة|القصيم/i, 'Buraydah'], [/hail|حائل/i, 'Hail']];
const endDepot = st => { for (const [re, d] of END_DEPOT) if (re.test(st || '')) return d; return ''; };
function tripEnd(code) {
  code = String(code || '').toUpperCase().replace(/\s+/g, ' ').trim(); if (!code) return '';
  if (TRIP_END[code]) return TRIP_END[code];
  const parts = code.split('+').map(x => x.trim()).filter(Boolean); return TRIP_END[parts[parts.length - 1]] || '';
}
async function loadTrips() {
  try { const c = JSON.parse(localStorage.getItem('nwTripEnd') || 'null'); if (c && Date.now() - c.at < 12 * 3600e3) { TRIP_END = c.m; return; } } catch (e) {}
  try {
    const tx = await (await fetch('https://hanode40-sketch.github.io/trip/', { cache: 'no-cache' })).text();
    const m = tx.match(/const TRIP_DATA=(\[[\s\S]*?\]);\s*\n/);
    if (m) JSON.parse(m[1]).forEach(t => {
      const end = t[6] && t[6].end ? t[6].end : t[2];
      TRIP_END[String(t[0]).toUpperCase().replace(/\s+/g, ' ').trim()] = end;
      const first = String(t[0]).split('+')[0].trim().toUpperCase(); if (!TRIP_END[first]) TRIP_END[first] = t[2];
      if (t[6] && t[6].code) TRIP_END[String(t[6].code).toUpperCase()] = t[6].end;
    });
    if (Object.keys(TRIP_END).length) try { localStorage.setItem('nwTripEnd', JSON.stringify({ at: Date.now(), m: TRIP_END })); } catch (e) {}
  } catch (e) {}
}
const addD = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
/* نفس حساب «إدارة السائقين»: بدون رحلة يومين متتاليين أو أقل = راحة، أكثر = استعداد — والمعتذر/المستبدل اليوم = استعداد — والراحة اليدوية تبقى راحة.
   مكانه الليلة (راحة أو استعداد) = كراج وصول آخر رحلة قبل اليوم، وإذا ما له رحلات = كراجه في إدارة السائقين */
async function loadRest(today) {
  await loadTrips();
  const r = await NWAuth.call('rosterRange', { from: addD(today, -30), to: addD(today, 6) });
  if (!r || !r.ok) return;
  const days = r.days || {}, SETS = {}, trips = {}, last = {}, cnt = {};
  Object.keys(days).filter(k => (days[k] || []).length).forEach(k => {
    const set = {}; days[k].forEach(x => [x[1], x[2]].forEach(iq => { iq = String(iq || '').trim(); if (!iq) return; set[iq] = String(x[0]); (trips[iq] = trips[iq] || []).push([k, String(x[0])]); }));
    SETS[k] = set;
  });
  Object.values(trips).forEach(t => t.sort((a, b) => a[0] < b[0] ? -1 : 1));
  Object.keys(SETS).filter(k => k < today).sort().forEach(k => Object.keys(SETS[k]).forEach(iq => {
    const g = endDepot(tripEnd(SETS[k][iq])); last[iq] = { date: k, code: SETS[k][iq], g };
    if (g) { cnt[iq] = cnt[iq] || {}; cnt[iq][g] = (cnt[iq][g] || 0) + 1; }
  }));
  const usual = {}; Object.keys(cnt).forEach(iq => { const e = Object.entries(cnt[iq]).sort((a, b) => b[1] - a[1])[0]; usual[iq] = { g: e[0], n: e[1] }; });
  const onToday = SETS[today] || {}, rosterN = (days[today] || []).length;
  const out = {}; (r.subs || []).filter(x => x.date === today).forEach(x => { out[x.orig] = x; });
  const restm = {}; (r.marks || []).filter(x => x.date === today && x.mark === 'rest').forEach(x => { restm[x.iqama] = 1; });
  const state = {};   // iq → 'rest' | 'sb'
  D.drivers.forEach(x => {
    const iq = x[0]; if (x[RC.st] !== 'operation' || onToday[iq]) return;
    if (restm[iq]) { state[iq] = 'rest'; return; }
    if (out[iq] || x[RC.sb] === 'نعم') { state[iq] = 'sb'; return; }
    if (!rosterN) return;
    let n = 1; for (let k = 1; k <= 30; k++) { const s = SETS[addD(today, -k)]; if (!s || s[iq]) break; n++; }
    for (let k = 1; k <= 6; k++) { const s = SETS[addD(today, k)]; if (!s || s[iq]) break; n++; }
    state[iq] = n <= 2 ? 'rest' : 'sb';
  });
  RS = { ok: true, last, today: onToday, usual, trips, state, out };
}
const usualG = iq => (RS.usual[iq] || {}).g || '';
const homeG = iq => usualG(iq) || (DRV[iq] || [])[3] || '';
const nextTrip = (iq, after) => (RS.trips[iq] || []).find(x => x[0] > after) || null;
/** مكانه الليلة (للترانزيت) — ما عنده رحلة اليوم:
    استعداد (من إدارة السائقين): كراج وصول آخر رحلة له مهما كان تاريخها، وإذا ما له رحلات = كراجه
    راحة: آخر رحلة له خلال آخر 3 أيام — كراج الراحة = مدينة وصولها */
function restToday(iq) {
  if (!RS.ok || !RS.state[iq]) return '';

}
function histHtml(iq) {
  const h = D.log.filter(r => r[1] === iq).slice(0, 6);
  if (!h.length) return '';
  return '<div><label>آخر العمليات</label><div class="info" style="line-height:1.9">' + h.map(r => '<b>' + esc(r[3]) + '</b> <span class="mono">' + esc(r[6]) + '</span> — ' + esc(gTxt(r[5] || r[4])) + (r[7] ? ' <span class="mut">(' + esc(r[7]) + ')</span>' : '')).join('<br>') + '</div></div>';
}

function assignDlg(iq, roomId, bed) {
  const cur = iq && OCC[iq];
  const g0 = roomId ? ROOM[roomId].garage : (iq && scopeGarages().includes(homeG(iq)) ? homeG(iq) : (G !== 'all' ? G : scopeGarages()[0]));
  modal(cur ? 'نقل سائق' : 'تسكين سائق',
    '<div class="sw"><label>السائق</label><input id="as" autocomplete="off" placeholder="اكتب الاسم أو رقم الإقامة"' + (iq ? ' value="' + esc((DRV[iq] || [])[RC.name] || '') + '"' + (cur ? ' disabled' : '') : '') + '><div class="sug" id="asg"></div></div>' +
    '<div id="acur"></div>' +
    '<div class="row3"><div><label>الكراج</label><select id="ag">' + gOpts(g0) + '</select></div><div><label>الغرفة</label><select id="ar"></select></div><div><label>السرير</label><select id="ab"></select></div></div>' +
    '<div class="row2"><div><label>التاريخ</label><input id="ad" type="date" value="' + D.today + '"></div><div><label>ملاحظة (اختياري)</label><input id="an" placeholder="' + (cur ? 'سبب النقل' : '') + '"></div></div>',
    '<button class="btn green" id="asave">' + (cur ? 'نقل' : 'تسكين') + '</button>');
  let IQ = iq || '';
  const showCur = () => {
    const c = IQ && OCC[IQ], d = DRV[IQ];
    $('acur').innerHTML = (c ? '<div class="warnbox">ساكن حالياً في ' + esc(DEP[ROOM[c.room].garage] || '') + ' · ' + esc(rLabel(ROOM[c.room])) + ' · سرير ' + c.bed + ' — بيتم نقله</div>' : '') +
      (d && !NEEDS_HOUSE.includes(d[RC.st]) ? '<div class="warnbox">حالته: ' + esc((ST[d[RC.st]] || {}).ar || d[RC.st]) + '</div>' : '') +
      (IQ && RS.usual[IQ] ? '<div class="info">كراج راحته المعتاد: <b>' + esc(DEP[RS.usual[IQ].g] || RS.usual[IQ].g) + '</b> (' + RS.usual[IQ].n + ' رحلة خلال آخر 30 يوم)</div>' : '');
  };
  const fillRooms = keep => {
    const g = $('ag').value, list = Object.values(ROOM).filter(r => r.garage === g && r.type !== 'ترانزيت' && r.state !== 'صيانة' && freeBeds(r).length).sort((a, b) => natSort(a.bld + '|' + a.no.padStart(6, '0'), b.bld + '|' + b.no.padStart(6, '0')));
    $('ar').innerHTML = list.length ? list.map(r => '<option value="' + r.id + '"' + (r.id === keep ? ' selected' : '') + '>' + esc(rLabel(r)) + ' (' + freeBeds(r).length + ' فاضي)</option>').join('') : '<option value="">ما في غرف فاضية</option>';
    fillBeds(bed);
  };
  const fillBeds = keep => { const r = ROOM[$('ar').value]; $('ab').innerHTML = r ? freeBeds(r).map(i => '<option' + (i == keep ? ' selected' : '') + '>' + i + '</option>').join('') : ''; };
  $('ag').onchange = () => fillRooms(); $('ar').onchange = () => fillBeds();
  fillRooms(roomId); showCur();
  if (!cur) driverSearch($('as'), $('asg'), x => { IQ = x[0]; $('as').value = x[RC.name]; showCur(); const g = homeG(x[0]); if (!roomId && scopeGarages().includes(g) && $('ag').value !== g) { $('ag').value = g; fillRooms(); } });
  $('asave').onclick = e => {
    if (!IQ) return mErr('اختر السائق من القائمة');
    if (!$('ar').value || !$('ab').value) return mErr('اختر الغرفة والسرير');
    HL = IQ;
    busy(e.target, call('housingAssign', { iqama: IQ, room: $('ar').value, bed: $('ab').value, date: $('ad').value, note: $('an').value.trim() })).then(r => r && toast((cur ? 'تم النقل' : 'تم التسكين') + ' ✅'));
  };
  if (!iq) setTimeout(() => $('as').focus(), 50);
}
function driverSearch(inp, box, pick) {
  let act = -1, items = [];
  const show = () => {
    const q = inp.value.trim().toLowerCase(); act = -1;
    if (q.length < 2) { box.classList.remove('on'); return; }
    items = D.drivers.filter(x => String(x[RC.name]).toLowerCase().includes(q) || String(x[0]).includes(q) || String(x[RC.emp]).includes(q))
      .sort((a, b) => (OCC[a[0]] ? 1 : 0) - (OCC[b[0]] ? 1 : 0) || (NEEDS_HOUSE.includes(a[RC.st]) ? 0 : 1) - (NEEDS_HOUSE.includes(b[RC.st]) ? 0 : 1)).slice(0, 25);
    box.innerHTML = items.length ? items.map((x, i) => '<div data-i="' + i + '"><b>' + esc(x[RC.name]) + '</b><small>' + esc(x[0]) + ' · ' + esc(DEP[x[RC.dep]] || x[RC.dep]) + ' · ' + esc((ST[x[RC.st]] || {}).ar || x[RC.st]) +
      (OCC[x[0]] ? ' · 🏠 ساكن: ' + esc(rLabel(ROOM[OCC[x[0]].room])) : '') + '</small></div>').join('') : '<div class="mut">ما لقيت سائق</div>';
    box.classList.add('on');
  };
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => {
    const ds = box.querySelectorAll('[data-i]'); if (!ds.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + ds.length) % ds.length; ds.forEach((d, i) => d.classList.toggle('act', i === act)); }
    else if (e.key === 'Enter') { e.preventDefault(); const x = items[act < 0 ? 0 : act]; if (x) { pick(x); box.classList.remove('on'); } }
  });
  box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (!d) return; e.preventDefault(); pick(items[+d.dataset.i]); box.classList.remove('on'); });
  inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('on'), 150));
}
function vacateDlg(iq) {
  const o = OCC[iq], r = ROOM[o.room], s = drvSt(iq);
  const sugg = s === 'Termination of services' ? 'إنهاء خدمات' : s === 'Absconding' ? 'هروب' : '';
  modal('إخلاء سكن — ' + esc(o.name),
    '<div class="info">' + esc(DEP[r.garage] || r.garage) + ' · ' + esc(rLabel(r)) + ' · سرير ' + o.bed + '</div>' +
    '<div class="row2"><div><label>السبب</label><select id="vr">' + ['إنهاء خدمات', 'استقالة', 'هروب', 'نقل لكراج آخر', 'سكن خاص', 'أخرى'].map(x => '<option' + (x === sugg ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
    '<div><label>تاريخ الإخلاء</label><input id="vd" type="date" value="' + D.today + '"></div></div><div><label>ملاحظة (اختياري)</label><input id="vn" placeholder="مثال: سلّم المفتاح"></div>',
    '<button class="btn red" id="vsave">تأكيد الإخلاء</button>');
  $('vsave').onclick = e => busy(e.target, call('housingVacate', { iqama: iq, date: $('vd').value, reason: $('vr').value + ($('vn').value.trim() ? ' — ' + $('vn').value.trim() : '') })).then(r => r && toast('تم الإخلاء ✅'));
}

function csv() {
  const rows = [['السائق', 'رقم الإقامة', 'الرقم الوظيفي', 'الجوال', 'الجنسية', 'الحالة', 'الكراج', 'المبنى', 'الغرفة', 'السرير', 'تاريخ السكن', 'ملاحظة']];
  residents().sort((a, b) => natSort(ROOM[a.room].garage + ROOM[a.room].bld + ROOM[a.room].no.padStart(6, '0') + a.bed, ROOM[b.room].garage + ROOM[b.room].bld + ROOM[b.room].no.padStart(6, '0') + b.bed)).forEach(o => {
    const r = ROOM[o.room], d = DRV[o.iq] || [];
    rows.push([o.name, o.iq, d[RC.emp] || '', d[RC.mob] || '', d[RC.nat] || '', (ST[d[RC.st]] || {}).ar || d[RC.st] || '', DEP[r.garage] || r.garage, r.bld, r.no, o.bed, o.date, o.note]);
  });
  Object.values(ROOM).filter(r => inG(r.garage)).forEach(r => freeBeds(r).forEach(b => rows.push(['— فاضي —', '', '', '', '', r.state === 'صيانة' ? 'صيانة' : '', DEP[r.garage] || r.garage, r.bld, r.no, b, '', ''])));
  const txt = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = 'سكن_السائقين_' + (G === 'all' ? 'الكل' : (DEP[G] || G)) + '_' + D.today + '.csv'; a.click();
}

/* ===== الأحداث ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-g],[data-tab],[data-go],[data-act],[data-room],[data-bed],[data-occ],[data-assign],[data-trn],[data-tin],[data-tout],[data-x]');
  if (!t) { if (e.target === $('ov')) closeM(); return; }
  const ds = t.dataset;
  if (ds.x) return closeM();
  if (ds.g) { G = ds.g; HL = ''; return render(); }
  if (ds.tab) { TAB = ds.tab; Q = ''; F = 'all'; return render(); }
  if (ds.go) { const [tb, f] = ds.go.split(':'); if (tb === 'bulk') return bulkDlg(); TAB = tb; F = f || 'all'; Q = ''; render(); $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (ds.act === 'room') return roomDlg('');
  if (ds.act === 'bulk') return bulkDlg();
  if (ds.act === 'csv') return csv();
  if (ds.act === 'print') return window.print();
  if (ds.room) return roomDlg(ds.room);
  if (ds.bed) { const [id, b] = ds.bed.split(':'); return ROOM[id].type === 'ترانزيت' ? transitDlg('', id, +b) : assignDlg('', id, +b); }
  if (ds.trn) return trnDlg(ds.trn);
  if (ds.tin) return transitDlg(ds.tin);
  if (ds.tout) return tOut(t, ds.tout);
  if (ds.act === 'tin') return transitDlg('');
  if (ds.act === 'auto') return planDlg('perm', UNLIST);
  if (ds.act === 'trall') return planDlg('tr', needTransit());
  if (ds.occ) return occDlg(ds.occ);
  if (ds.assign) return assignDlg(ds.assign);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { Q = e.target.value; const p = e.target.selectionStart; view(); const q = $('q'); q.focus(); q.setSelectionRange(p, p); }
});
document.addEventListener('change', e => { if (e.target.id === 'f') { F = e.target.value; view(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
load();
</script>
