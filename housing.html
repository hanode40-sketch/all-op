<style>

  html[data-theme="dark"]{--ink:#e5e7eb;--muted:#9aa6b8;--line:#263042;--soft:#0f1624;--card:#151c2b;--gbg:#12301f;--g:#4ade80;--ybg:#3a2e12;--y:#fbbf24;--rbg:#3a1e22;--r:#f87171;--bbg:#172554;--b:#93c5fd;--nbg:#1e2a44;--navy:#9ec1ff}

  .sec{margin:22px 4px 10px;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;text-shadow:0 2px 6px rgba(0,0,0,.4)}

  html[data-theme="dark"] .tile{border-color:var(--line)}

  .meter{height:7px;border-radius:5px;background:var(--nbg);margin-top:8px;overflow:hidden} .meter i{display:block;height:100%;background:var(--acc)}

  .tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}

  .tab.on{background:#1f3f7a;color:#fff} .tab b{font-size:12px;background:var(--nbg);color:var(--ink);border-radius:999px;padding:1px 8px;margin-inline-start:4px} .tab.on b{background:rgba(255,255,255,.2);color:#fff}
  .tools{display:flex;gap:8px;padding:12px;flex-wrap:wrap;align-items:center} .tools input,.tools select{width:auto;flex:1;min-width:160px;padding:9px 10px;font-size:14px}
  .tools .sp{flex:1}

  .bed:hover{background:var(--soft)} .bed .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--nbg);color:var(--muted);flex:none}
  .bed.full .n{background:#1f3f7a;color:#fff} .bed .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .bed.empty .nm{color:var(--muted);font-weight:500} .bed .add{color:var(--g);font-weight:800;font-size:12px}
  .bed .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .room.maint .bed{cursor:default} .room .mt{padding:10px 12px;font-size:12.5px;color:var(--y);font-weight:700;border-top:1px solid var(--line)}
  .hl{outline:3px solid #f97316;outline-offset:-3px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
  th{font-size:12px;color:var(--muted);background:var(--soft);position:sticky;top:0}
  tbody tr:hover td{background:var(--soft)} .tw{overflow:auto;max-height:70vh}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .s-active{background:var(--gbg);color:var(--g)} .s-leave{background:var(--bbg);color:var(--b)} .s-warn{background:var(--ybg);color:var(--y)} .s-out{background:var(--rbg);color:var(--r)}
  .msg{text-align:center;padding:28px;color:var(--muted)} .msg.err{color:var(--r);font-weight:700}
  .mono{font-variant-numeric:tabular-nums} .mut{color:var(--muted);font-size:12px}
  .ov{position:fixed;inset:0;z-index:100000;background:rgba(8,15,30,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
  .ov.on{display:flex}
  .md{background:var(--card);color:var(--ink);border-radius:18px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .md .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)} .md .mh h3{margin:0;font-size:17px}
  .md .mh button{all:unset;cursor:pointer;font-size:22px;color:var(--muted);padding:0 4px}
  .md .mb{padding:16px 18px;display:grid;gap:12px} .md .mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .md .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .md .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .info{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7}
  .warnbox{background:var(--ybg);color:var(--y);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
  .errbox{background:var(--rbg);color:var(--r);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;display:none} .errbox.on{display:block}
  .sw{position:relative} .sug{display:none;position:absolute;top:100%;inset-inline:0;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:0 0 10px 10px;max-height:260px;overflow-y:auto;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .sug.on{display:block} .sug div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px} .sug div:hover,.sug div.act{background:var(--soft)}
  .sug b{display:block;font-size:14px} .sug small{color:var(--muted)}
  .toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:100001;display:none}
  .toast.on{display:block}
  @media (max-width:640px){ .md .row2,.md .row3{grid-template-columns:1fr} .top h1{font-size:18px} }
  @media print{ body{background:#fff;padding:0} .top,.tabs,.tools,.alerts,#chips,.tiles,.sec{display:none!important} .panel{box-shadow:none;border:0} .tw{max-height:none;overflow:visible} }
</style>

<body>
<div class="wrap">
  <div class="top">
    <div><h1>🏠 سكن السائقين</h1><div class="en">Drivers Housing</div></div>
    <a class="back" href="./">‹ الرئيسية</a>
  </div>

  <div class="chips" id="chips"></div>
  <div class="sec">نظرة عامة</div>
  <div class="tiles" id="tiles"></div>
  <div class="alerts" id="alerts"></div>

  <div class="sec">التفاصيل</div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="view"><div class="msg">جاري التحميل…</div></div>
  </div>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const DEP = { 'Shumaysi':'الشميسي','Madinah':'المدينة','Tabuk':'تبوك','Riyadh':'الرياض','Jazan':'جازان','Khamis Mushait':'خميس مشيط','Al Bashayer':'البشائر','Buraydah':'بريدة','Hail':'حائل','Unassigned':'غير محدد' };
const ST = {
  'operation':{ar:'على رأس العمل',c:'s-active'}, 'Annual Leave':{ar:'إجازة سنوية',c:'s-leave'}, 'Emergency Leave':{ar:'إجازة اضطرارية',c:'s-leave'}, 'Sick Leave':{ar:'إجازة مرضية',c:'s-leave'},
  'Not Returned':{ar:'لم يعد من الإجازة',c:'s-warn'}, 'Suspended':{ar:'موقوف عن العمل',c:'s-warn'}, 'Absconding':{ar:'هروب',c:'s-out'}, 'Termination of services':{ar:'إنهاء خدمات',c:'s-out'}
};
const OUT = ['Absconding', 'Termination of services'], WARN = ['Not Returned', 'Suspended'], LEAVE = ['Annual Leave', 'Emergency Leave', 'Sick Leave'];
const NEEDS_HOUSE = ['operation', 'Annual Leave', 'Emergency Leave', 'Sick Leave'];
const ERR = { FORBIDDEN:'ما عندك صلاحية لهذي العملية', ROOM_NOT_EMPTY:'الغرفة فيها ساكنين — انقلهم أو أخلهم أول', DUP_ROOM:'الغرفة موجودة بنفس الرقم في نفس الكراج والمبنى',
  BEDS_IN_USE:'فيه سائق على سرير رقمه أكبر من العدد الجديد', BAD_ROOM:'اكتب الكراج ورقم الغرفة وعدد الأسرّة', ROOM_MAINT:'الغرفة تحت صيانة', BAD_BED:'اختر السرير',
  BED_TAKEN:'السرير مشغول', NO_DRIVER:'السائق مو موجود في إدارة السائقين', SAME_BED:'السائق ساكن في نفس السرير', NOT_HOUSED:'السائق مو ساكن', BAD_IQAMA:'اختر السائق',
  NOT_FOUND:'ما لقيت الغرفة', AUTH:'انتهت الجلسة — سجّل دخول من جديد', NO_URL:'تعذر الاتصال' };
const RC = { iq:0, name:1, st:2, dep:3, mob:4, nat:5, emp:6 };

let D = null, G = 'all', TAB = 'rooms', Q = '', F = 'all', HL = '';
let ROOM = {}, OCC = {}, BYROOM = {}, DRV = {};

function toast(t, ms) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms || 2600); }
function call(action, data) {
  return NWAuth.call(action, data || {}).then(r => {
    if (!r || !r.ok) { if (NWAuth.isAuthError(r)) NWAuth.relogin(); const e = new Error(ERR[r && r.error] || ('خطأ: ' + ((r && r.error) || 'غير معروف'))); e.res = r; throw e; }
    return r;
  });
}
function load() {
  return call('housingGet').then(set).catch(e => { $('view').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}
function set(r) {
  D = r; ROOM = {}; OCC = {}; BYROOM = {}; DRV = {};
  r.drivers.forEach(x => DRV[x[0]] = x);
  r.rooms.forEach(x => { ROOM[x[0]] = { id:x[0], garage:x[1], bld:x[2], no:x[3], beds:+x[4] || 0, state:x[5], note:x[6] }; BYROOM[x[0]] = {}; });
  r.occ.forEach(x => { const o = { iq:x[0], name:x[1], room:x[2], bed:+x[3], date:x[4], note:x[5], by:x[6] }; OCC[x[0]] = o; if (BYROOM[x[2]]) BYROOM[x[2]][o.bed] = o; });
  if (G !== 'all' && !scopeGarages().includes(G)) G = 'all';
  render();
}
const canEdit = () => D && D.perms.edit, canRooms = () => D && D.perms.rooms;
const scopeGarages = () => D.perms.garages.length ? D.perms.garages : D.garages;
const inG = g => G === 'all' ? scopeGarages().includes(g) : g === G;
const roomsIn = () => Object.values(ROOM).filter(r => inG(r.garage));
const drvSt = iq => (DRV[iq] || [])[RC.st] || '';
const stChip = s => s ? '<span class="chip ' + ((ST[s] || {}).c || 's-warn') + '">' + esc((ST[s] || {}).ar || s) + '</span>' : '<span class="chip s-out">مو موجود بالقائمة</span>';
const rLabel = r => r ? ((r.bld ? r.bld + ' · ' : '') + 'غرفة ' + r.no) : '—';
const natSort = (a, b) => String(a).localeCompare(String(b), 'ar', { numeric:true });
function freeBeds(r) { const o = BYROOM[r.id] || {}; const f = []; for (let i = 1; i <= r.beds; i++) if (!o[i]) f.push(i); return f; }
function stats(rooms) {
  let beds = 0, used = 0, maint = 0;
  rooms.forEach(r => { const n = Object.keys(BYROOM[r.id] || {}).length; used += n; if (r.state === 'صيانة') maint += r.beds; beds += r.beds; });
  return { rooms: rooms.length, beds, used, free: Math.max(0, beds - used - maint), maint };
}
function residents() { return Object.values(OCC).filter(o => ROOM[o.room] && inG(ROOM[o.room].garage)); }
function unhoused() {
  return D.drivers.filter(x => NEEDS_HOUSE.includes(x[RC.st]) && !OCC[x[0]] && (G === 'all' ? scopeGarages().includes(x[RC.dep]) : x[RC.dep] === G));
}

function render() {
  const gs = scopeGarages(), all = Object.values(ROOM);
  if (gs.length === 1) G = gs[0];
  $('chips').innerHTML = (gs.length > 1 ? '<button class="gch' + (G === 'all' ? ' on' : '') + '" data-g="all">كل الكراجات</button>' : '') +
    gs.map(g => { const n = all.filter(r => r.garage === g).length; return '<button class="gch' + (G === g ? ' on' : '') + '" data-g="' + g + '">' + esc(DEP[g] || g) + (n ? '<small>' + n + ' غرفة</small>' : '') + '</button>'; }).join('');
  const s = stats(roomsIn()), res = residents(), un = unhoused();
  const out = res.filter(o => OUT.includes(drvSt(o.iq)) || !DRV[o.iq]), warn = res.filter(o => WARN.includes(drvSt(o.iq))), lv = res.filter(o => LEAVE.includes(drvSt(o.iq)));
  const pct = s.beds ? Math.round(s.used / s.beds * 100) : 0;
  const tile = (acc, lb, v, sub, go, meter) => '<button class="tile" style="--acc:' + acc + '" data-go="' + go + '"><div class="lb">' + lb + '</div><b class="mono">' + v + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + (meter != null ? '<div class="meter"><i style="width:' + meter + '%"></i></div>' : '') + '</button>';
  $('tiles').innerHTML =
    tile('#1f3f7a', 'الغرف', s.rooms, s.maint ? 'منها تحت صيانة: ' + Math.round(s.maint) + ' سرير' : '', 'rooms:all') +
    tile('#0369a1', 'الأسرّة', s.beds, '', 'rooms:all') +
    tile('#15803d', 'مشغول', s.used, 'نسبة الإشغال ' + pct + '%', 'res', pct) +
    tile('#0d9488', 'فاضي', s.free, 'جاهز للتسكين', 'rooms:free') +
    tile('#d97706', 'بدون سكن', un.length, 'على رأس العمل أو في إجازة', 'un') +
    tile('#dc2626', 'يحتاج إخلاء', out.length, 'هروب أو إنهاء خدمات', 'res:out');
  let al = '';
  if (out.length) al += '<div class="alert red" data-go="res:out">⚠️ ' + out.length + ' ساكن حالتهم هروب أو إنهاء خدمات — أسرّتهم محجوزة ويحتاجون إخلاء</div>';
  if (warn.length) al += '<div class="alert" data-go="res:warn">⏳ ' + warn.length + ' ساكن موقوفين أو لم يعودوا من الإجازة — راجع حالتهم</div>';
  if (lv.length) al += '<div class="alert blue" data-go="res:leave">🧳 ' + lv.length + ' ساكن في إجازة الحين (السرير محجوز لهم وفاضي فعلياً)</div>';
  if (!all.length && canRooms()) al += '<div class="alert blue" data-go="bulk">🏗️ ابدأ بإضافة غرف الكراج — اضغط هنا لإضافة مجموعة غرف مرة وحدة</div>';
  $('alerts').innerHTML = al;
  const T = [['rooms', 'الغرف', s.rooms], ['res', 'الساكنين', res.length], ['un', 'بدون سكن', un.length], ['log', 'السجل', '']];
  $('tabs').innerHTML = T.map(t => '<button class="tab' + (TAB === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[2] !== '' ? '<b>' + t[2] + '</b>' : '') + '</button>').join('');
  view();
}

function view() {
  const v = $('view');
  if (TAB === 'rooms') return v.innerHTML = vRooms();
  if (TAB === 'res') return v.innerHTML = vRes();
  if (TAB === 'un') return v.innerHTML = vUn();
  v.innerHTML = vLog();
}
function toolsBar(ph, filters, extra) {
  return '<div class="tools"><input id="q" placeholder="' + ph + '" value="' + esc(Q) + '">' +
    (filters ? '<select id="f">' + filters.map(f => '<option value="' + f[0] + '"' + (F === f[0] ? ' selected' : '') + '>' + f[1] + '</option>').join('') + '</select>' : '') +
    '<span class="sp"></span>' + (extra || '') + '</div>';
}

function driverSearch(inp, box, pick) {
  let act = -1, items = [];
  const show = () => {
    const q = inp.value.trim().toLowerCase(); act = -1;
    if (q.length < 2) { box.classList.remove('on'); return; }
    items = D.drivers.filter(x => String(x[RC.name]).toLowerCase().includes(q) || String(x[0]).includes(q) || String(x[RC.emp]).includes(q))
      .sort((a, b) => (OCC[a[0]] ? 1 : 0) - (OCC[b[0]] ? 1 : 0) || (NEEDS_HOUSE.includes(a[RC.st]) ? 0 : 1) - (NEEDS_HOUSE.includes(b[RC.st]) ? 0 : 1)).slice(0, 25);
    box.innerHTML = items.length ? items.map((x, i) => '<div data-i="' + i + '"><b>' + esc(x[RC.name]) + '</b><small>' + esc(x[0]) + ' · ' + esc(DEP[x[RC.dep]] || x[RC.dep]) + ' · ' + esc((ST[x[RC.st]] || {}).ar || x[RC.st]) +
      (OCC[x[0]] ? ' · 🏠 ساكن: ' + esc(rLabel(ROOM[OCC[x[0]].room])) : '') + '</small></div>').join('') : '<div class="mut">ما لقيت سائق</div>';
    box.classList.add('on');
  };
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => {
    const ds = box.querySelectorAll('[data-i]'); if (!ds.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + ds.length) % ds.length; ds.forEach((d, i) => d.classList.toggle('act', i === act)); }
    else if (e.key === 'Enter') { e.preventDefault(); const x = items[act < 0 ? 0 : act]; if (x) { pick(x); box.classList.remove('on'); } }
  });
  box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (!d) return; e.preventDefault(); pick(items[+d.dataset.i]); box.classList.remove('on'); });
  inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('on'), 150));
}
function vacateDlg(iq) {
  const o = OCC[iq], r = ROOM[o.room], s = drvSt(iq);
  const sugg = s === 'Termination of services' ? 'إنهاء خدمات' : s === 'Absconding' ? 'هروب' : '';
  modal('إخلاء سكن — ' + esc(o.name),
    '<div class="info">' + esc(DEP[r.garage] || r.garage) + ' · ' + esc(rLabel(r)) + ' · سرير ' + o.bed + '</div>' +
    '<div class="row2"><div><label>السبب</label><select id="vr">' + ['إنهاء خدمات', 'استقالة', 'هروب', 'نقل لكراج آخر', 'سكن خاص', 'أخرى'].map(x => '<option' + (x === sugg ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
    '<div><label>تاريخ الإخلاء</label><input id="vd" type="date" value="' + D.today + '"></div></div><div><label>ملاحظة (اختياري)</label><input id="vn" placeholder="مثال: سلّم المفتاح"></div>',
    '<button class="btn red" id="vsave">تأكيد الإخلاء</button>');
  $('vsave').onclick = e => busy(e.target, call('housingVacate', { iqama: iq, date: $('vd').value, reason: $('vr').value + ($('vn').value.trim() ? ' — ' + $('vn').value.trim() : '') })).then(r => r && toast('تم الإخلاء ✅'));
}

function csv() {
  const rows = [['السائق', 'رقم الإقامة', 'الرقم الوظيفي', 'الجوال', 'الجنسية', 'الحالة', 'الكراج', 'المبنى', 'الغرفة', 'السرير', 'تاريخ السكن', 'ملاحظة']];
  residents().sort((a, b) => natSort(ROOM[a.room].garage + ROOM[a.room].bld + ROOM[a.room].no.padStart(6, '0') + a.bed, ROOM[b.room].garage + ROOM[b.room].bld + ROOM[b.room].no.padStart(6, '0') + b.bed)).forEach(o => {
    const r = ROOM[o.room], d = DRV[o.iq] || [];
    rows.push([o.name, o.iq, d[RC.emp] || '', d[RC.mob] || '', d[RC.nat] || '', (ST[d[RC.st]] || {}).ar || d[RC.st] || '', DEP[r.garage] || r.garage, r.bld, r.no, o.bed, o.date, o.note]);
  });
  Object.values(ROOM).filter(r => inG(r.garage)).forEach(r => freeBeds(r).forEach(b => rows.push(['— فاضي —', '', '', '', '', r.state === 'صيانة' ? 'صيانة' : '', DEP[r.garage] || r.garage, r.bld, r.no, b, '', ''])));
  const txt = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = 'سكن_السائقين_' + (G === 'all' ? 'الكل' : (DEP[G] || G)) + '_' + D.today + '.csv'; a.click();
}

/* ===== الأحداث ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-g],[data-tab],[data-go],[data-act],[data-room],[data-bed],[data-occ],[data-assign],[data-x]');
  if (!t) { if (e.target === $('ov')) closeM(); return; }
  const ds = t.dataset;
  if (ds.x) return closeM();
  if (ds.g) { G = ds.g; HL = ''; return render(); }
  if (ds.tab) { TAB = ds.tab; Q = ''; F = 'all'; return render(); }
  if (ds.go) { const [tb, f] = ds.go.split(':'); if (tb === 'bulk') return bulkDlg(); TAB = tb; F = f || 'all'; Q = ''; render(); $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (ds.act === 'room') return roomDlg('');
  if (ds.act === 'bulk') return bulkDlg();
  if (ds.act === 'csv') return csv();
  if (ds.act === 'print') return window.print();
  if (ds.room) return roomDlg(ds.room);
  if (ds.bed) { const [id, b] = ds.bed.split(':'); return assignDlg('', id, +b); }
  if (ds.occ) return occDlg(ds.occ);
  if (ds.assign) return assignDlg(ds.assign);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { Q = e.target.value; const p = e.target.selectionStart; view(); const q = $('q'); q.focus(); q.setSelectionRange(p, p); }
});
document.addEventListener('change', e => { if (e.target.id === 'f') { F = e.target.value; view(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
load();
</script>
