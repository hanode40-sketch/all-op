/* الراحة والاستعداد: نحسب كم يوم متتالي السائق غير مجدول حول التاريخ المختار
   (نرجع ونتقدم يوم يوم في الروستر المرفوع لين نلقاه مجدول أو ينقطع الروستر)

  if (!days) { try { const j = await NWAuth.call('rosterGet', { date }); days = {}; if (j && j.ok && (j.rows || []).length) { days[date] = j.rows; subs = j.subs || []; } } catch (e) { days = {}; } }

function picker(qId, sId, selId) {
  const q = $(qId), box = $(sId), sel = $(selId); let hits = [], act = -1;
  const hide = () => { box.classList.remove('on'); box.innerHTML = ''; hits = []; act = -1; };
  const show = () => {
    const v = q.value.trim().toLowerCase(); if (!v) { hide(); return; }
    hits = [...sel.options].filter(o => o.value && (o.text.toLowerCase().includes(v) || o.value.includes(v))).slice(0, 20);
    if (!hits.length) { box.innerHTML = `<div style="cursor:default;color:var(--muted)">${t_('noMatch')}</div>`; box.classList.add('on'); return; }
    box.innerHTML = hits.map((o, i) => `<div data-pk="${i}">${esc(o.text)}<br><small>${esc(o.value)}</small></div>`).join(''); box.classList.add('on'); act = -1;
  };
  const pick = i => { const o = hits[i]; if (!o) return; sel.value = o.value; q.value = ''; hide(); sel.style.outline = '3px solid #16a34a'; setTimeout(() => sel.style.outline = '', 900); };
  q.addEventListener('input', show); q.addEventListener('focus', show); q.addEventListener('blur', () => setTimeout(hide, 150));
  q.addEventListener('keydown', e => {
    if (!hits.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; [...box.children].forEach((x, i) => x.classList.toggle('act', i === act)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(act < 0 ? 0 : act); }
    else if (e.key === 'Escape') hide();
  });
  box.addEventListener('mousedown', e => { const x = e.target.closest('[data-pk]'); if (x) { e.preventDefault(); pick(+x.dataset.pk); } });
}

  const r = D.find(x => x[C.IQ] === iq); if (!r) return;
  const trip = ROSTER[iq], here = dep(r);
  SW = { orig: iq, trip, date: $('fDate').value };
  $('swOrigW').style.display = 'none'; $('swRepW').style.display = '';
  $('swSub').textContent = `${r[C.NAME]} · 🚌 ${trip} · ${SW.date}`;
  const opt = x => { const loc = sbDep(x), l = lastTrip(x); return `<option value="${esc(x[C.IQ])}">${esc(x[C.NAME])} · 📍 ${esc(depName(loc))}${loc === here ? ' ✓' : ''}${l ? ' · ' + esc(l.code) : ''}</option>`; };
  const sort = a => a.sort((x, y) => (sbDep(y) === here) - (sbDep(x) === here) || String(x[C.NAME]).localeCompare(String(y[C.NAME])));
  const sb = sort(D.filter(isStandby)), rs = sort(D.filter(isRest));
  const ex = D.filter(x => isOnTrip(x) && x[C.IQ] !== iq && !SWIN[x[C.IQ]] && ROSTER[x[C.IQ]] !== trip)
    .sort((x, y) => (dep(y) === here) - (dep(x) === here) || String(ROSTER[x[C.IQ]]).localeCompare(String(ROSTER[y[C.IQ]])));
  const optX = x => `<option value="${esc(x[C.IQ])}">🔁 ${esc(ROSTER[x[C.IQ]])} · ${esc(x[C.NAME])} · ${esc(depName(dep(x)))}${dep(x) === here ? ' ✓' : ''}</option>`;
  $('swRep').innerHTML = `<option value="">— ${t_('swPick')} —</option>` + (sb.length ? `<optgroup label="${t_('swG1')} (${sb.length})">${sb.map(opt).join('')}</optgroup>` : '') + (rs.length ? `<optgroup label="${t_('swG2')} (${rs.length})">${rs.map(opt).join('')}</optgroup>` : '') + (ex.length ? `<optgroup label="${t_('swG3')} (${ex.length})">${ex.map(optX).join('')}</optgroup>` : '');
  $('swNote').value = ''; $('swReason').value = ''; $('swRepQ').value = ''; $('swOv').classList.add('on'); setTimeout(() => $('swRepQ').focus(), 50);
}
$('swCancel').onclick = () => { $('swOv').classList.remove('on'); SW = null; };
$('swOv').addEventListener('click', e => { if (e.target.id === 'swOv') $('swOv').classList.remove('on'); });
$('swSave').onclick = async () => {
  if (SW.rep) { const o = $('swOrig').value; if (!o) return alert(t_('swPickO')); SW.orig = o; SW.trip = ROSTER[o]; }
  const rep = SW.rep || $('swRep').value; if (!rep) return alert(t_('swPick'));
  if (!$('swReason').value) { $('swReason').focus(); return alert(t_('swNeedR')); }
  if ($('swNote').value.trim().length < 3) { $('swNote').focus(); return alert(t_('swNeedN')); }
  const b = $('swSave'); b.disabled = true;
  try {
    const exchange = !!ROSTER[rep];
    if (exchange) { const a = D.find(x => x[C.IQ] === SW.orig), bb = D.find(x => x[C.IQ] === rep);
      if (!confirm(t_('xAsk')(a ? a[C.NAME] : SW.orig, SW.trip, bb ? bb[C.NAME] : rep, ROSTER[rep]))) return; }
    const j = await NWAuth.call('driverSwap', { swap: { date: SW.date, trip: SW.trip, orig: SW.orig, rep, reason: $('swReason').value, note: $('swNote').value, exchange } });
    if (j.error === 'AUTH') { NWAuth.relogin(); throw new Error(t_('eAuth')); }
    if (!j.ok) throw new Error({ FORBIDDEN: t_('eForb'), REP_BUSY: t_('swBusy'), SAME_TRIP: t_('swSame2'), NEED_REASON: t_('swNeedN'), NOT_IN_ROSTER: t_('swNotIn') }[j.error] || t_('eErr') + j.error);
    $('swOv').classList.remove('on'); SW = null; await loadRoster(); render(); alert(t_('swDone'));
  } catch (e) { alert(e.message); } finally { b.disabled = false; }
};
async function unswap(iq) {
  const x = SWIN[iq]; if (!x || !confirm(t_('unswAsk'))) return;
  try {
    const pair = isX(iq) ? SWOUT[iq] : null;   // تبادل: يلغي الطرفين
    const j = await NWAuth.call('swapCancel', { swap: pair ? { date: x.date, trip: x.trip, rep: x.rep, orig: x.orig, pairTrip: pair.trip } : { date: x.date, trip: x.trip, rep: x.rep } });
    if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? t_('eForb') : t_('eErr') + j.error);
    await loadRoster(); render();
  } catch (e) { alert(e.message); }
}
$('bRefresh').onclick = load;
$('fDepot').onchange = render;
$('fDate').onchange = async () => { await loadRoster(); render(); };
['fStatus', 'fNat'].forEach(id => $(id).addEventListener('input', renderList));
/* بحث بالاقتراحات (نفس طريقة باقي البرامج) */
let SUG = [], SUGI = -1;
function sugHide() { $('qSug').classList.remove('on'); $('qSug').innerHTML = ''; SUG = []; SUGI = -1; }
function sugShow() {
  const q = $('q').value.trim().toLowerCase(); if (!q) { sugHide(); return; }
  SUG = filtered($('fDepot').value).filter(r => [r[C.NAME], r[C.IQ], r[C.EMP], r[C.MOB], ROSTER[r[C.IQ]] || ''].join(' ').toLowerCase().includes(q)).slice(0, 15);
  if (!SUG.length) { sugHide(); return; }
  $('qSug').innerHTML = SUG.map((r, i) => `<div data-sg="${i}"><b>${esc(r[C.NAME])}</b><small>${esc(r[C.IQ])} · ${esc(depName(r[C.DEP]))} · ${esc(stName(r[C.ST]))}${ROSTER[r[C.IQ]] ? ' · 🚌 ' + esc(ROSTER[r[C.IQ]]) : isRest(r) ? ' · 😴 ' + t_('rest') : isStandby(r) ? ' · ' + t_('standby') : ''}</small></div>`).join('');
  $('qSug').classList.add('on'); SUGI = -1;
}
function sugPick(i) {
  const r = SUG[i]; if (!r) return;
  $('q').value = r[C.IQ]; sugHide(); LISTF = ''; $('fStatus').value = ''; $('fNat').value = ''; renderList();
}
$('q').addEventListener('input', () => { renderList(); sugShow(); });
$('q').addEventListener('focus', sugShow);
$('q').addEventListener('blur', () => setTimeout(sugHide, 150));
$('q').addEventListener('keydown', e => {
  if (!SUG.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SUGI = (SUGI + (e.key === 'ArrowDown' ? 1 : -1) + SUG.length) % SUG.length;
    [...$('qSug').children].forEach((x, i) => x.classList.toggle('act', i === SUGI)); }
  else if (e.key === 'Enter') { e.preventDefault(); sugPick(SUGI < 0 ? 0 : SUGI); }
  else if (e.key === 'Escape') sugHide();
});
$('qSug').addEventListener('mousedown', e => { const x = e.target.closest('[data-sg]'); if (x) { e.preventDefault(); sugPick(+x.dataset.sg); } });
function applyLang() {
  const h = document.documentElement; h.lang = LANG; h.dir = LANG === 'en' ? 'ltr' : 'rtl';
  document.querySelectorAll('[data-i]').forEach(e => { const v = t_(e.dataset.i); if (typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = t_(e.dataset.ph));
  document.title = t_('title') + ' · ' + (LANG === 'en' ? 'Operations Tools' : 'أدوات التشغيل');
}
window.addEventListener('storage', e => { if (e.key === 'hubLang') { LANG = e.newValue === 'en' ? 'en' : 'ar'; applyLang(); fillFilters(); render(); } });
$('fDate').value = today();
applyLang(); fillFilters();
if (window.NWAuth) load();
</script>
