<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{var t=localStorage.getItem('nwTheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="https://hanode40-sketch.github.io/all-op/auth.js" data-tool="drivers"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c4a7a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>إدارة السائقين · أدوات التشغيل</title>
<style>
  :root{ --navy:#1f3f7a; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb; --soft:#f8fafc;
    --g:#15803d; --gbg:#e7f5ed; --y:#b45309; --ybg:#fef3c7; --r:#b91c1c; --rbg:#fdecea; --b:#1d4ed8; --bbg:#dbeafe; --n:#475569; --nbg:#f1f5f9; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;color:var(--ink);
    background:#2c4a7a;position:relative;min-height:100vh;padding:20px 14px 90px}
  .wrap{max-width:1800px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;position:sticky;top:0;z-index:50;margin:-20px -14px 18px;
    padding:14px 14px 12px;border-radius:0 0 16px 16px;background:rgba(31,63,122,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .top h1{margin:0;font-size:22px}
  .top .en{font-size:13px;opacity:.8}
  .back{color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;white-space:nowrap}
  .panel{background:#fff;border-radius:16px;border:1px solid rgba(15,23,42,.06);box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(10,25,55,.16)}
  .bar{padding:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .bar>div{flex:1;min-width:160px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  select,input{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
  .btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--navy);color:#fff;white-space:nowrap}
  .btn.light{background:#eef2f7;color:var(--navy)} .btn.green{background:#15803d} .btn:disabled{opacity:.6;cursor:wait}
  .sec{margin:22px 4px 10px;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
  .sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.25)}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;color:var(--ink);font-family:inherit;
    border:1px solid rgba(15,23,42,.06);box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(10,25,55,.16);transition:transform .15s}
  .tile:hover{transform:translateY(-3px)} .tile::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--acc)}
  .tile .lb{font-size:13px;color:var(--muted);font-weight:600} .tile b{display:block;font-size:30px;margin-top:6px} .tile small{font-size:12px;color:var(--muted)}
  .tiles.s{grid-template-columns:repeat(10,1fr)} .tiles.s .tile b{font-size:24px}
  .grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  .card{padding:16px;min-width:0} .card h2{margin:0 0 12px;font-size:16px;color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th{font-size:12px;color:var(--muted);background:var(--soft)} th:first-child,td:first-child{text-align:start}
  td.c{cursor:pointer} td.c:hover{background:var(--soft);color:var(--navy);font-weight:700} tr.tot td{font-weight:800}
  .tw{overflow-x:auto}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .s-operation{background:var(--gbg);color:var(--g)} .s-annual{background:var(--bbg);color:var(--b)} .s-emergency{background:var(--ybg);color:var(--y)} .s-sick{background:#fce7f3;color:#9d174d}
  .s-out{background:var(--rbg);color:var(--r)} .s-sb{background:#ede9fe;color:#6d28d9} .s-trip{background:#ccfbf1;color:#0f766e} .s-late{background:#dc2626;color:#fff}
  .list{overflow-x:auto}
  .list .row{display:grid;grid-template-columns:minmax(210px,1.7fr) minmax(90px,.8fr) minmax(80px,.7fr) minmax(120px,1fr) minmax(170px,1.4fr) minmax(130px,1fr) minmax(110px,.9fr) minmax(110px,.9fr) 150px;gap:12px;align-items:start;padding:12px;border-bottom:1px solid var(--line);min-width:1240px}
  .list .row>span,.list .row>div{min-width:0;font-size:13.5px}
  .list .row.hd{background:var(--soft);font-size:12px;color:var(--muted);font-weight:700;align-items:center;position:sticky;top:0}
  .list .row.hd>span{font-size:12px}
  .list .sub2{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  .list .dash{color:var(--muted)} .list .mono{font-variant-numeric:tabular-nums}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap} .pager span{font-weight:700;color:var(--muted);padding:0 8px} .pager .btn{padding:7px 14px}
  .list .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end} .list .acts .btn{padding:7px 10px;font-size:12.5px}
  .list .row:hover{background:var(--soft)}
  .nm b{display:block} .nm small{color:var(--muted);font-size:12px}
  .msg{text-align:center;padding:24px;color:var(--muted)} .msg.err{color:var(--r);font-weight:700}
  .sug{display:none;position:absolute;top:100%;inset-inline:0;z-index:60;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:320px;overflow-y:auto;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .sug.on{display:block}
  .sug div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
  .sug div:hover,.sug div.act{background:var(--soft)}
  .sug b{display:block;font-size:14px} .sug small{color:var(--muted)}
  html[data-theme="dark"] .sug{background:#151c2b}
  .alerts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .alert.blue{background:#eff6ff;border-color:#93c5fd;color:#1e3a8a}
  .alert.red{background:#fdecea;border-color:#f87171;color:#991b1b}
  .alert{padding:12px 16px;border-radius:14px;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;font-weight:700;cursor:pointer}

  .rp-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
  .rp-k div{border:1px solid var(--nw-line,#e5e7eb);border-radius:12px;padding:10px;text-align:center}.rp-k b{display:block;font-size:22px}.rp-k span{font-size:12px;opacity:.75}
  .rp-t{width:100%;border-collapse:collapse;font-size:13px}.rp-t th,.rp-t td{padding:7px 8px;border-bottom:1px solid var(--nw-line,#e5e7eb);text-align:start;white-space:nowrap}
  .rp-t th{position:sticky;top:0;background:var(--nw-card,#fff);font-size:12px;opacity:.85}.rp-t tr.cl{cursor:pointer}.rp-t tr.cl:hover td{background:rgba(59,130,246,.08)}
  .rp-w{max-height:60vh;overflow:auto;border:1px solid var(--nw-line,#e5e7eb);border-radius:12px}
  .rp-b{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:#fff}
  .rp-trip{background:#16a34a}.rp-rest{background:#64748b}.rp-sb{background:#7c3aed}.rp-leave{background:#2563eb}.rp-swap{background:#ea580c}.rp-out{background:#dc2626}.rp-none{background:#cbd5e1;color:#334155}
  .rp-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:6px}
  .ov{position:fixed;inset:0;z-index:100000;background:rgba(8,15,30,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
  .ov.on{display:flex}
  .md{background:#fff;border-radius:18px;width:100%;max-width:720px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .md h3{margin:0 0 4px} .md .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:12px} .fg .full{grid-column:1/-1}
  .tog{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;font-weight:700}
  .tog input{width:20px;height:20px}
  .hist{margin-top:14px;max-height:220px;overflow:auto;font-size:12.5px;border-top:1px dashed var(--line);padding-top:10px}
  .hist div{padding:4px 0;border-bottom:1px solid var(--soft)}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .note{color:rgba(255,255,255,.85);font-size:12px;margin:10px 4px 0;line-height:1.7}

  html[data-theme="dark"]{--ink:#e5e7eb;--muted:#9aa6b8;--line:#263042;--soft:#0f1624;--gbg:#12301f;--g:#4ade80;--ybg:#3a2e12;--y:#fbbf24;--rbg:#3a1e22;--r:#f87171;--bbg:#172554;--b:#93c5fd;--nbg:#1e2a44}
  html[data-theme="dark"] body{background:#0b1220} 
  html[data-theme="dark"] .panel,html[data-theme="dark"] .tile,html[data-theme="dark"] .md{background:#151c2b;border-color:var(--line)}
  html[data-theme="dark"] .top{background:rgba(11,18,32,.88);border-bottom:1px solid #263042}
  html[data-theme="dark"] .card h2{color:#9ec1ff} html[data-theme="dark"] .btn.light{background:#1e2a44;color:#c7d7f5}
  html[data-theme="dark"] .s-sick{background:#4a1d33;color:#f9a8d4} html[data-theme="dark"] .s-sb{background:#2e1f4f;color:#c4b5fd} html[data-theme="dark"] .s-trip{background:#123b38;color:#5eead4}
  html[data-theme="dark"] .alert{background:#2a1a0e;border-color:#9a3412;color:#fed7aa}
  html[data-theme="dark"] .alert.blue{background:#172554;border-color:#1d4ed8;color:#bfdbfe}
  html[data-theme="dark"] .alert.red{background:#3a1e22;border-color:#b91c1c;color:#fecaca}
  @media (min-width:1500px){ .grid2{grid-template-columns:1.5fr 1fr} }
  @media (max-width:1000px){ .tiles{grid-template-columns:repeat(3,1fr)} .tiles.s{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:700px){ .bar .tbtns{flex:1 1 100%!important} .list .chip{white-space:normal;word-break:break-word} .tiles,.tiles.s{grid-template-columns:1fr 1fr} .list .row{grid-template-columns:1.4fr 1fr 1fr;min-width:0} .list .row .hm{display:none} .list .row .acts{grid-column:1/-1;justify-content:flex-start} .fg{grid-template-columns:1fr} .top h1{font-size:18px} }
  @media print{ body{background:#fff!important;padding:0} body::before,.bar,.back,.nws,.nwh,.btn{display:none!important} .top{position:static;background:none;color:#000;box-shadow:none} .sec{color:#000;text-shadow:none} }

  /* ===== التصميم الموحد (ألوان auth.js --nw-*) ===== */
  :root,html[data-theme="dark"]{--ink:var(--nw-ink,#0f172a);--muted:var(--nw-muted,#64748b);--line:var(--nw-line,#e5e7eb);--soft:var(--nw-soft,#f8fafc)}
  body{background:var(--nw-bg,#eef2f8)!important;font-family:var(--nw-font,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif);-webkit-font-smoothing:antialiased}
  .top{background:var(--nw-hero,#13274f)!important;border-bottom:0!important;box-shadow:0 8px 24px rgba(19,39,79,.18)}
  .panel,.tile,.md{background:var(--nw-card,#fff)!important;border:1px solid var(--nw-line,#e5e7eb)!important;box-shadow:var(--nw-shadow)!important}
  .tile::before{height:3px;opacity:.85}
  .sec{color:var(--nw-muted,#64748b);text-shadow:none;font-size:14px;font-weight:800}
  .sec::after{background:var(--nw-line,#e2e8f0)}
  .note{color:var(--nw-muted,#64748b)}
  .btn{background:var(--nw-navy,#13274f)} .btn.light{background:var(--nw-soft,#eef2f7);color:var(--nw-ink,#13274f);border:1px solid var(--nw-line,#e2e8f0)}
  html[data-theme="dark"] .btn.light{background:#1b2540;color:#dbe5f7;border-color:#24304a}
  .card h2{color:var(--nw-ink,#13274f)}
  .alert{border-radius:12px;font-weight:600;background:var(--nw-card,#fff)!important;color:var(--nw-ink,#0f172a)!important;border:1px solid var(--nw-line,#e2e8f0)!important;border-inline-start:4px solid #d97706!important;box-shadow:var(--nw-shadow)}
  .alert.blue{border-inline-start-color:#2563eb!important} .alert.red{border-inline-start-color:#dc2626!important}
  select,input{background:var(--nw-card,#fff)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 style="display:flex;align-items:center;gap:10px"><span id="tIc">👨‍✈️</span> <span data-i="title">إدارة السائقين</span></h1><div class="en" data-i="subtitle">Drivers Management</div></div>
    <a class="back" href="./" data-i="back">← أدوات التشغيل</a>
  </div>

  <div class="panel bar">
    <div><label data-i="lDate">تاريخ الروستر (على الرحلات / الاستعداد)</label><input id="fDate" type="date"></div>
    <div><label data-i="lDepot">الكراج</label><select id="fDepot"></select></div>
    <div class="tbtns" style="flex:0 1 auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn light" id="bRefresh" data-i="refresh">↻ تحديث</button>
      <button class="btn light" id="bExport" data-i="export">⬇️ Excel</button>
      <button class="btn light" id="bDash" data-i="dash">📊 الداش بورد</button>
      <button class="btn light" id="bRpt" data-i="rpt">📄 تقرير عمل السائقين</button>
      <button class="btn light" id="bCmp">⚖️ مقارنة يومين</button>
      <button class="btn" id="bAdd" style="display:none" data-i="add">➕ سائق جديد</button>
      <button class="btn light" id="bCards" style="display:none" data-i="cards">🪪 تحديث الكروت</button>
      <button class="btn light" id="bImport" style="display:none" data-i="import">📤 استيراد من Excel</button>
    </div>
  </div>

  <div class="alerts" id="alerts"></div>

  <div class="sec" data-i="secSum">الملخص</div>
  <div class="tiles" id="tMain"></div>
  <div class="tiles s" id="tStatus" style="margin-top:12px"></div>

  <div class="grid2">
    <div class="panel card"><h2 data-i="natTitle">السائقون حسب الجنسية والحالة</h2><div class="tw" id="natTable"></div></div>
    <div class="panel card"><h2 data-i="depTitle">سائقو التشغيل والاستعداد في الكراجات</h2><div class="tw" id="depTable"></div></div>
  </div>

  <div class="sec"><span data-i="secList">قائمة السائقين</span></div>
  <div class="panel">
    <div class="bar">
      <div style="flex:2;position:relative"><input id="q" type="search" autocomplete="off" data-ph="search" placeholder="ابحث برقم الإقامة أو الاسم أو الرحلة..."><div id="qSug" class="sug"></div></div>
      <div><select id="fStatus"></select></div>
      <div><select id="fNat"></select></div>
    </div>
    <div class="list" id="list"><div class="msg" data-i="loading">جاري التحميل...</div></div>
  </div>
  <div class="note" data-i="note">..</div>
</div>

<!-- تقرير عمل السائقين -->
<div class="ov" id="rpOv"><div class="md" style="max-width:1100px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">📄 تقرير عمل السائقين</h3><button class="btn light" id="rpX">✕</button></div>
  <div class="sub" id="rpSub">يوضح عمل كل سائق يوم بيوم حسب الروستر المرفوع: الرحلات، الراحة، الاستعداد، الإجازات، والتبديلات.</div>
  <div class="bar" style="margin-top:10px;align-items:flex-end">
    <div><label>من تاريخ</label><input id="rpFrom" type="date"></div>
    <div><label>إلى تاريخ</label><input id="rpTo" type="date"></div>
    <div style="flex:2;position:relative"><label>السائق (اتركه فاضي لكل السائقين)</label><input id="rpDrv" type="search" autocomplete="off" list="rpDl" placeholder="اسم السائق أو رقم الإقامة"><datalist id="rpDl"></datalist></div>
    <div style="flex:0 0 auto;display:flex;gap:6px"><button class="btn green" id="rpGo">عرض التقرير</button><button class="btn light" id="rpHr" title="ملف التحضير الشهري (Daily driver) اللي ينرسل للموارد كل شهر — الفترة من 21 إلى 20">📤 ملف التحضير الشهري</button></div>
  </div>
  <div id="rpOut" style="margin-top:12px"></div>
</div></div>
<!-- نافذة التبديل -->
<div class="ov" id="swOv"><div class="md" style="max-width:560px">
  <h3 data-i="swTitle">🔄 تبديل سائق</h3><div class="sub" id="swSub"></div>
  <div class="fg">
    <div class="full" id="swOrigW"><label data-i="swOrig">السائق المعتذر ورحلته</label><div style="position:relative;margin-bottom:8px"><input id="swOrigQ" type="search" autocomplete="off" data-ph="swQph"><div id="swOrigS" class="sug"></div></div><select id="swOrig"></select></div>
    <div class="full" id="swRepW"><label data-i="swRep">السائق البديل</label><div style="position:relative;margin-bottom:8px"><input id="swRepQ" type="search" autocomplete="off" data-ph="swQph"><div id="swRepS" class="sug"></div></div><select id="swRep"></select></div>
    <div><label><span data-i="swReason">السبب</span> <b style="color:#dc2626">*</b></label><select id="swReason"><option value="">— اختر السبب —</option><option>رفض الرحلة</option><option>مريض</option><option>غياب</option><option>ظرف طارئ</option><option>تأخر</option><option>أخرى</option></select></div>
    <div><label><span data-i="swNote">ملاحظة</span> <b style="color:#dc2626">*</b></label><input id="swNote" maxlength="300" data-ph="swNotePh" placeholder="اكتب تفاصيل السبب..."></div>
  </div>
  <div class="mbtns"><button class="btn light" id="swCancel" data-i="cancel">إلغاء</button><button class="btn green" id="swSave" data-i="swDo">تأكيد التبديل</button></div>
</div></div>
<!-- نافذة التعديل -->
<div class="ov" id="ov"><div class="md">
  <h3 id="mTitle"></h3><div class="sub" id="mSub"></div>
  <div class="fg">
    <div class="full" id="newFields" style="display:none">
      <div class="fg">
        <div><label data-i="fIq">رقم الإقامة</label><input id="eIq" inputmode="numeric"></div>
        <div><label data-i="fEmp">الرقم الوظيفي</label><input id="eEmp" inputmode="numeric"></div>
        <div><label data-i="fName">اسم السائق</label><input id="eName"></div>
        <div><label data-i="fNat">الجنسية</label><input id="eNat" list="natList"></div>
      </div>
    </div>
    <div><label data-i="fStatus">الحالة</label><select id="eStatus"></select></div>
    <div><label data-i="fDepot">الكراج</label><select id="eDepot"></select></div>
    <div class="full"><label class="tog"><input type="checkbox" id="eSb"> <span data-i="fSb">🟣 السائق على الاستعداد (Standby)</span></label></div>
    <div id="leaveF"><label data-i="fFrom">من تاريخ</label><input id="eFrom" type="date"></div>
    <div id="leaveT"><label data-i="fTo">تاريخ العودة المتوقع</label><input id="eTo" type="date"></div>
    <div class="full"><label data-i="fCard">🪪 انتهاء كرت التشغيل</label><input id="eCard" type="date"></div>
    <div><label data-i="fMob">الجوال</label><input id="eMob" inputmode="tel"></div>
    <div><label data-i="fNote">ملاحظة</label><input id="eNote" maxlength="300"></div>
  </div>
  <div id="cardBox" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
    <button class="btn light" id="mCardDl">🪪 <span data-i="cardDlFull">تحميل كرت التشغيل</span></button>

/* الراحة والاستعداد: نحسب كم يوم متتالي السائق غير مجدول حول التاريخ المختار
   (نرجع ونتقدم يوم يوم في الروستر المرفوع لين نلقاه مجدول أو ينقطع الروستر)
   يومين متتاليين أو أقل = راحة، أكثر من يومين = استعداد */
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
function loadRoster() { const p = ROSTER_P = loadRoster_(); p.finally(() => { if (ROSTER_P === p) ROSTER_P = null; }); return p; }
async function loadRoster_() {
  ROSTER = {}; ROSTER_N = 0; ROSTER_ROWS = []; ABSENT = {}; SINCE = {}; WEEK_N = 0;
  const date = $('fDate').value, from = addD(date, -30), to = addD(date, 6);
  let days = null;
  let subs = [], marks = [];
  try { const [j] = await Promise.all([NWAuth.call('rosterRange', { from, to }), loadDuties()]); if (j && j.ok) { days = j.days || {}; subs = j.subs || []; marks = j.marks || []; } } catch (e) {}
  if (!days) { try { const j = await NWAuth.call('rosterGet', { date }); days = {}; if (j && j.ok) { if ((j.rows || []).length) days[date] = j.rows; subs = j.subs || []; marks = j.marks || []; } } catch (e) { days = {}; } }
  RESTM = {}; marks.filter(x => x.date === date && x.mark === 'rest').forEach(x => { RESTM[x.iqama] = x; });
  SWOUT = {}; SWIN = {};
  subs.filter(x => x.date === date).forEach(x => { SWOUT[x.orig] = x; SWIN[x.rep] = x; });
  const SETS = {}; LAST = {};
  Object.keys(days).filter(k => (days[k] || []).length).forEach(k => {
    const set = {}; days[k].forEach(r => [r[1], r[2]].forEach(x => { if (x) set[String(x).trim()] = String(r[0]); }));
    SETS[k] = set; if (k === date) { ROSTER = set; ROSTER_N = days[k].length; ROSTER_ROWS = days[k]; }
  });
  WEEK_N = Object.keys(SETS).filter(k => k >= addD(date, -6)).length;
  // آخر رحلة لكل سائق قبل التاريخ المختار (حتى 30 يوم)
  Object.keys(SETS).filter(k => k < date).sort().forEach(k => { Object.keys(SETS[k]).forEach(iq => { LAST[iq] = { code: SETS[k][iq], date: k }; }); });
  if (!ROSTER_N) return;
  D.forEach(r => {
    const iq = r[C.IQ]; if (ROSTER[iq]) return;
    let n = 1, first = date;
    for (let k = 1; k <= 30; k++) { const dk = addD(date, -k), s = SETS[dk]; if (!s || s[iq]) break; n++; first = dk; }
    SINCE[iq] = first;
    for (let k = 1; k <= 6; k++) { const s = SETS[addD(date, k)]; if (!s || s[iq]) break; n++; }
    ABSENT[iq] = n;
  });
}
function fillFilters() {
  const keep = (id, html) => { const v = $(id).value; $(id).innerHTML = html; if ([...$(id).options].some(o => o.value === v)) $(id).value = v; };
  if (MINE) {
    keep('fDepot', (MINE.length > 1 ? `<option value="*mine">${t_('myDeps')}</option>` : '') + MINE.map(d => `<option value="${d}">${esc(depName(d))}</option>`).join(''));
    $('fDepot').disabled = MINE.length === 1;
  } else keep('fDepot', `<option value="">${t_('allDep')}</option>` + DEPOTS.map(d => `<option value="${d}">${esc(depName(d))}</option>`).join(''));
  keep('fStatus', `<option value="">${t_('allSt')}</option>` + STATUSES.map(s => `<option value="${s}">${esc(stName(s))}</option>`).join(''));
  const nats = [...new Set(D.map(r => r[C.NAT]).filter(Boolean))].sort();
  keep('fNat', `<option value="">${t_('allNat')}</option>` + nats.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join(''));
  $('eStatus').innerHTML = STATUSES.map(s => `<option value="${s}">${esc(stName(s))}</option>`).join('');
  $('eDepot').innerHTML = DEPOTS.map(d => `<option value="${d}">${esc(depName(d))}</option>`).join('');
}

/* ---------- فرق الروستر: كباتن مجدولين ما انحسبوا «على الرحلات» ---------- */
function rosterGaps(depot) {
  const seen = {}, unknown = [], notOp = [], all = {};
  (ROSTER_ROWS || []).forEach(row => [row[1], row[2]].forEach(x => { const iq = String(x || '').trim(); if (!iq) return;
    (all[iq] = all[iq] || []).push(String(row[0])); if (!seen[iq]) seen[iq] = String(row[0]); }));
  // أكثر من رحلة لنفس الكابتن: الطبيعي ذهاب وعودة على نفس الخط (مثل NW28 أو NW22-O-1 + NW22-I-2) — نطلع بس المشكوك فيه:
  // رحلتين بنفس الاتجاه (مغادرة + مغادرة أو عودة + عودة) على خطين مختلفين، أو نفس الرحلة مكررة
  const rk = t => (String(t).toUpperCase().match(/^NW\d+/) || [''])[0], dir = t => (String(t).toUpperCase().match(/-([OI])-/) || [, ''])[1];
  const dup = [];
  Object.keys(all).forEach(iq => { const T = all[iq]; if (T.length < 2) return;
    // الأساس: رقم الواجب من جدول الرحلات — كل الرحلات في نفس الواجب = طبيعي، واجبين مختلفين = مشكوك
    const du = T.map(t => (SDUTY || {})[String(t).toUpperCase().replace(/\s+/g, '')] || '');
    // مشكوك = نفس الرحلة مكررة، أو رحلتين بنفس الاتجاه على خطين مختلفين وفي واجبين مختلفين
    // (نفس الواجب = طبيعي · نفس الخط بأكثر من واجب مثل NW28 = طبيعي · وصول على خط ثم مغادرة على خط ثاني = طبيعي)
    const odd = T.some((a, i) => T.some((b, j) => j > i && (a === b || (dir(a) && dir(a) === dir(b) && rk(a) !== rk(b) && !(du[i] && du[i] === du[j])))));
    if (odd) dup.push({ iq, trips: T.map((t, i) => du[i] ? `${t} (${du[i]})` : t) }); });
  Object.keys(seen).forEach(iq => { const r = D.find(x => String(x[C.IQ]) === iq);
    if (!r) { if (!depot) unknown.push({ iq, trip:seen[iq] }); return; }
    if (r[C.ST] !== 'operation' && inDep(r[C.DEP], depot)) notOp.push({ r, trip:seen[iq] }); });
  return { unknown, notOp, dup:dup.filter(x => { const r = D.find(y => String(y[C.IQ]) === x.iq); return !depot || (r && inDep(r[C.DEP], depot)); }) };
}
function showGaps(depot) {
  const g = rosterGaps(depot), m = document.createElement('div'); m.className = 'ov on';
  const sec = (t, sub, body) => body ? `<h4 style="margin:14px 0 4px">${t}</h4><div class="sub" style="margin-bottom:6px">${sub}</div><div class="tw"><table><tbody>${body}</tbody></table></div>` : '';
  m.innerHTML = `<div class="md" style="max-width:760px"><h3 style="margin:0">⚠️ فرق روستر ${esc($('fDate').value)}</h3>
    <div class="sub">«على الرحلات» = الكباتن المسجّلين في روستر اليوم وحالتهم «على رأس العمل». هؤلاء موجودين في الروستر وما انحسبوا:</div>
    ${sec('🌴 مجدول وحالته مو «على رأس العمل»', 'إما الحالة في إدارة السائقين لازم تتحدّث، أو الروستر لازم يتعدّل ويتبدّل الكابتن', g.notOp.map(x => `<tr><td><b>${esc(x.r[C.NAME])}</b><br><span class="sub">${esc(x.r[C.IQ])} · ${esc(depName(x.r[C.DEP]))}</span></td><td dir="ltr">${esc(x.trip)}</td><td><b>${esc(stName(x.r[C.ST]))}</b>${x.r[C.TO] ? '<br><span class="sub">يرجع ' + esc(x.r[C.TO]) + '</span>' : ''}</td><td><button class="btn light" data-ed="${esc(x.r[C.IQ])}">فتح</button></td></tr>`).join(''))}
    ${sec('❓ رقم إقامة مو موجود في قائمة السائقين', 'غالباً رقم الإقامة مكتوب غلط في ملف الروستر، أو الكابتن جديد ما انضاف', g.unknown.map(x => `<tr><td dir="ltr"><b>${esc(x.iq)}</b></td><td dir="ltr">${esc(x.trip)}</td></tr>`).join(''))}
    ${sec('🔁 كابتن على رحلتين ما يمديه يجمعهم', 'رحلتين مغادرة (أو عودة) على خطين مختلفين ومن واجبين مختلفين حسب جدول الرحلات — غالباً خطأ في الروستر. رحلات نفس الواجب، أو نفس الخط (مثل NW28)، أو وصول ثم مغادرة على خط ثاني = طبيعي وما تطلع هنا. الواجب (Nº Bus Duty) بين القوسين', g.dup.map(x => { const r = D.find(y => String(y[C.IQ]) === x.iq); return `<tr><td><b>${esc(r ? r[C.NAME] : x.iq)}</b><br><span class="sub">${esc(x.iq)}</span></td><td dir="ltr">${x.trips.map(esc).join(' · ')}</td></tr>`; }).join(''))}
    <div class="mbtns"><button class="btn light" data-x>إغلاق</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.remove(); const b = e.target.closest('[data-ed]'); if (b) { m.remove(); openEdit(b.dataset.ed); } });
}

/* ---------- مقارنة روستر يومين: ليش اختلف عدد «على الرحلات» ---------- */
$('bCmp').onclick = () => {
  const d0 = $('fDate').value || ymd(new Date());
  const m = document.createElement('div'); m.className = 'ov on';
  m.innerHTML = `<div class="md" style="max-width:900px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">⚖️ مقارنة روستر يومين</h3><button class="btn light" data-x>✕</button></div>
    <div class="sub">يوضح ليش اختلف عدد «على الرحلات» بين يومين: الرحلات، والكباتن، والحالات.</div>
    <div class="bar" style="margin-top:10px;align-items:flex-end"><div><label>اليوم الأول</label><input type="date" id="cA" value="${addD(d0, -1)}"></div><div><label>اليوم الثاني</label><input type="date" id="cB" value="${d0}"></div><div style="flex:0 0 auto"><button class="btn green" id="cGo">قارن</button></div></div>
    <div id="cOut" style="margin-top:12px"></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.remove(); const b = e.target.closest('[data-ed]'); if (b) { m.remove(); openEdit(b.dataset.ed); } });
  m.querySelector('#cGo').onclick = async () => {
    const A = m.querySelector('#cA').value, B = m.querySelector('#cB').value, out = m.querySelector('#cOut'), depot = $('fDepot').value;
    if (!A || !B || A === B) return alert('اختر يومين مختلفين');
    out.innerHTML = '<div class="msg">⏳ جاري التحميل...</div>';
    const from = A < B ? A : B, to = A < B ? B : A; let j = null;
    try { j = await NWAuth.call('rosterRange', { from, to }); } catch (e) {}
    if (!j || !j.ok) { out.innerHTML = '<div class="msg err">تعذّر تحميل الروستر</div>'; return; }
    const info = k => { const rows = (j.days || {})[k] || [], trips = {}, iqs = {};
      const dup = {}; let seats = 0;
      rows.forEach(r => { const t = String(r[0]).trim(), L = [r[1], r[2]].map(x => String(x || '').trim()).filter(Boolean); trips[t] = L; seats += L.length; L.forEach(iq => { if (iqs[iq]) (dup[iq] = dup[iq] || [iqs[iq]]).push(t); else iqs[iq] = t; }); });
      const R0 = iq => D.find(x => String(x[C.IQ]) === iq);
      const counted = Object.keys(iqs).filter(iq => { const r = R0(iq); return r && r[C.ST] === 'operation' && inDep(r[C.DEP], depot); });
      const per = {}; Object.keys(trips).forEach(t => trips[t].forEach(iq => (per[iq] = per[iq] || []).push(t)));
      return { rows, trips, iqs, counted, R0, dup, seats, per }; };
    const a = info(A), b = info(B);
    if (!a.rows.length || !b.rows.length) { out.innerHTML = `<div class="msg err">ما فيه روستر مرفوع ليوم ${!a.rows.length ? A : B}</div>`; return; }
    const nm = (x, iq) => { const r = x.R0(iq); return r ? `<b>${esc(r[C.NAME])}</b> <span class="sub">${esc(iq)} · ${esc(stName(r[C.ST]))}</span>` : `<b dir="ltr">${esc(iq)}</b> <span class="sub">مو موجود في قائمة السائقين</span>`; };
    const onlyA = Object.keys(a.trips).filter(t => !b.trips[t]), onlyB = Object.keys(b.trips).filter(t => !a.trips[t]);
    const seatDiff = Object.keys(a.trips).filter(t => b.trips[t] && a.trips[t].length !== b.trips[t].length);
    const why = (x, k) => Object.keys(x.iqs).filter(iq => !x.counted.includes(iq)).map(iq => { const r = x.R0(iq); if (r && !inDep(r[C.DEP], depot)) return ''; return `<tr><td>${nm(x, iq)}</td><td dir="ltr">${esc(x.iqs[iq])}</td></tr>`; }).join('');
    const tb = (head, body) => body ? `<div class="tw" style="margin-bottom:10px"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` : '<div class="sub" style="margin-bottom:10px">— لا يوجد</div>';
    out.innerHTML = `<div class="tw" style="margin-bottom:12px"><table><thead><tr><th></th><th>${A}</th><th>${B}</th><th>الفرق</th></tr></thead><tbody>
      <tr><td>عدد الرحلات في الروستر</td><td>${Object.keys(a.trips).length}</td><td>${Object.keys(b.trips).length}</td><td><b>${Object.keys(b.trips).length - Object.keys(a.trips).length}</b></td></tr>
      <tr><td>خانات الكباتن في الرحلات</td><td>${a.seats}</td><td>${b.seats}</td><td><b>${b.seats - a.seats}</b></td></tr>
      <tr><td>الكباتن المسجّلين في الروستر (بدون تكرار)</td><td>${Object.keys(a.iqs).length}</td><td>${Object.keys(b.iqs).length}</td><td><b>${Object.keys(b.iqs).length - Object.keys(a.iqs).length}</b></td></tr>
      <tr><td><b>على الرحلات</b> (على رأس العمل${depot ? ' · الكراج المختار' : ''})</td><td><b>${a.counted.length}</b></td><td><b>${b.counted.length}</b></td><td><b>${b.counted.length - a.counted.length}</b></td></tr></tbody></table></div>
      ${(() => { const xa = a.seats - Object.keys(a.iqs).length, xb = b.seats - Object.keys(b.iqs).length;
        return `<div class="alert blue" style="margin-bottom:12px;cursor:default">💡 «على الرحلات» = عدد الكباتن (الأشخاص)، مو عدد الخانات. الكابتن اللي يسوي أكثر من رحلة في اليوم (ذهاب وعودة مثلاً) ينحسب مرة وحدة.<br>
          ${A}: ${a.seats} خانة − ${xa} رحلة إضافية لنفس الكباتن = <b>${Object.keys(a.iqs).length}</b> كابتن · ${B}: ${b.seats} خانة − ${xb} رحلة إضافية = <b>${Object.keys(b.iqs).length}</b> كابتن
          ${xa !== xb ? `<br>👈 الفرق سببه توزيع الرحلات على الكباتن: في ${xb > xa ? B : A} فيه ${Math.abs(xb - xa)} رحلة زيادة انضافت لكابتن عنده رحلة ثانية بدل ما تروح لكابتن مستقل.` : ''}</div>`; })()}
      <h4 style="margin:8px 0 4px">📈 كباتن تغيّر عدد رحلاتهم بين اليومين</h4>
      ${tb(`<th>الكابتن</th><th>${A}</th><th>${B}</th>`, [...new Set(Object.keys(a.per).concat(Object.keys(b.per)))].filter(iq => (a.per[iq] || []).length !== (b.per[iq] || []).length).sort((x, y) => ((b.per[y] || []).length - (a.per[y] || []).length) - ((b.per[x] || []).length - (a.per[x] || []).length))
        .map(iq => `<tr><td>${nm(a.R0(iq) ? a : b, iq)}</td><td dir="ltr">${(a.per[iq] || []).length ? (a.per[iq] || []).map(esc).join(' · ') : '<span class="sub">—</span>'}</td><td dir="ltr">${(b.per[iq] || []).length ? (b.per[iq] || []).map(esc).join(' · ') : '<span class="sub">—</span>'}</td></tr>`).join(''))}
      <h4 style="margin:8px 0 4px">🚌 رحلات موجودة في يوم وناقصة في الثاني</h4>
      ${tb('<th>الرحلة</th><th>موجودة في</th><th>الكباتن</th>', onlyA.map(t => `<tr><td dir="ltr"><b>${esc(t)}</b></td><td>${A} فقط</td><td>${a.trips[t].length}</td></tr>`).concat(onlyB.map(t => `<tr><td dir="ltr"><b>${esc(t)}</b></td><td>${B} فقط</td><td>${b.trips[t].length}</td></tr>`)).join(''))}
      <h4 style="margin:8px 0 4px">👥 نفس الرحلة وعدد الكباتن مختلف</h4>
      ${tb(`<th>الرحلة</th><th>${A}</th><th>${B}</th>`, seatDiff.map(t => `<tr><td dir="ltr"><b>${esc(t)}</b></td><td>${a.trips[t].length}</td><td>${b.trips[t].length}</td></tr>`).join(''))}
      <details style="margin:8px 0"><summary style="cursor:pointer;font-weight:700">🔁 كل الكباتن اللي عندهم أكثر من رحلة (${Object.keys(a.dup).length} · ${Object.keys(b.dup).length}) — طبيعي للذهاب والعودة</summary>
      ${tb('<th>اليوم</th><th>الكابتن</th><th>الرحلات</th>', [[A, a], [B, b]].map(([k, x]) => Object.keys(x.dup).map(iq => `<tr><td>${k}</td><td>${nm(x, iq)} <button class="btn light" data-ed="${esc(iq)}" style="padding:3px 9px">فتح</button></td><td dir="ltr">${x.dup[iq].map(esc).join(' · ')}</td></tr>`).join('')).join(''))}
      </details>
      <h4 style="margin:8px 0 4px">🌴 مسجّلين في الروستر وما انحسبوا — ${A}</h4>${tb('<th>الكابتن</th><th>الرحلة</th>', why(a, A))}
      <h4 style="margin:8px 0 4px">🌴 مسجّلين في الروستر وما انحسبوا — ${B}</h4>${tb('<th>الكابتن</th><th>الرحلة</th>', why(b, B))}
      <div class="sub">«على الرحلات» يحسب الكابتن مرة وحدة حتى لو مكرر في أكثر من رحلة. حالة الكابتن المعروضة هي حالته الحالية في إدارة السائقين.</div>`;
  };
  m.querySelector('#cGo').click();
};

let EDIT = null;
function openEdit(iq) {
  const r = iq ? D.find(x => x[C.IQ] === iq) : null; EDIT = r ? r[C.IQ] : '';
  $('newFields').style.display = r ? 'none' : 'block';
  $('cardBox').style.display = r ? 'flex' : 'none';
  if (r) { $('mCardDl').style.display = CARDS[r[C.IQ]] ? '' : 'none'; $('mCardUp').style.display = canCardsE ? '' : 'none'; $('mCardMsg').textContent = CARDS[r[C.IQ]] ? '' : t_('noCardF'); }
  $('mTitle').textContent = r ? r[C.NAME] : t_('newTitle');
  $('mSub').textContent = r ? `${r[C.IQ]}${r[C.EMP] ? ' · ' + r[C.EMP] : ''} · ${r[C.NAT]}${r[C.BY] ? ' — ' + t_('lastBy') + ': ' + r[C.BY] + ' (' + r[C.AT] + ')' : ''}` : '';
  ['eIq','eEmp','eName','eNat','eFrom','eTo','eMob','eNote','eCard'].forEach(id => $(id).value = '');
  $('eStatus').value = r ? r[C.ST] : 'operation'; $('eDepot').value = r ? (r[C.DEP] || 'Unassigned') : (($('fDepot').value && $('fDepot').value !== '*mine') ? $('fDepot').value : (MINE ? MINE[0] : 'Unassigned'));
  $('eSb').checked = r ? r[C.SB] === 'نعم' : false;
  if (r) { $('eFrom').value = r[C.FROM]; $('eTo').value = r[C.TO]; $('eMob').value = r[C.MOB]; $('eNote').value = r[C.NOTE]; $('eCard').value = r[C.CARD] || ''; }
  ['eStatus','eDepot','eSb','eFrom','eTo','eMob','eNote','eCard','eIq','eEmp','eName','eNat'].forEach(id => $(id).disabled = !canEdit);
  $('eCard').disabled = !canCardsE;   // العلاقات الحكومية: تاريخ الكرت فقط
  $('mSave').style.display = canEdit || (canCardsE && r) ? '' : 'none';
  leaveFields(); $('ov').classList.add('on');
  $('hist').innerHTML = r ? `<div class="msg" style="padding:8px">${t_('histLoading')}</div>` : '';
  if (r) NWAuth.call('driverHistory', { iqama: r[C.IQ] }).then(j => {
    const h = (j && j.history) || [];
    $('hist').innerHTML = `<b>${t_('hist')}</b>` + (h.length ? h.map(x => `<div>🕒 ${esc(x[0])} · <b>${esc(x[3])}</b>: ${esc(x[4] || '—')} ${LANG==='en'?'→':'←'} ${esc(x[5])} · ${esc(x[6])}${x[7] ? ' — ' + esc(x[7]) : ''}</div>`).join('') : `<div>${t_('noHist')}</div>`);

 ${sbRows.map(x => `<tr><td class="l"><b>${x[0]}</b></td><td>${x[1]}</td><td>${ROSTER_N ? x[2] : '—'}</td></tr>`).join('')}<tr class="tot" style="--x:1"><td class="l">Grand Total | الإجمالي</td><td>${sbRows.reduce((a, x) => a + x[1], 0)}</td><td>${ROSTER_N ? sbRows.reduce((a, x) => a + x[2], 0) : '—'}</td></tr></tbody></table></div></div>

<script>
// صفحة وحدة: نصغّر اللوحة على مقاس A4 بالعرض قبل الطباعة
function fit(){var el=document.getElementById(document.body.classList.contains('v-dark')?'dash2':'dash');el.style.zoom=1;var h=el.scrollHeight,w=el.scrollWidth;var z=Math.min(1060/w,700/h)*0.97;el.style.zoom=z;}

document.querySelectorAll('.bar .t').forEach(function(b){b.onclick=function(){setV(b.dataset.v)}});

 function go(){(function(){var dk=document.body.classList.contains('v-dark');return html2canvas(document.getElementById(dk?'dash2':'dash'),{scale:2,useCORS:true,backgroundColor:dk?'#0b1530':'#ffffff'})})().then(function(c){var a=document.createElement('a');a.download='Drivers_Dashboard_${date}.png';a.href=c.toDataURL('image/png');a.click();b.disabled=false;b.textContent='🖼️ حفظ صورة PNG';});}
 if(window.html2canvas)return go();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=go;s.onerror=function(){alert('تعذّر تحميل أداة الصور — استخدم الطباعة / PDF');b.disabled=false;};document.head.appendChild(s);};
<\/script></body></html>`;
  const w = w0 || window.open('', '_blank');
  if (!w) { alert(LANG === 'en' ? 'Allow pop-ups to open the dashboard' : 'اسمح بالنوافذ المنبثقة لفتح الداش بورد'); return; }

};

/* ---------- الأحداث ---------- */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { LISTF = f.dataset.f; renderList(true); document.getElementById('list').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { dayMark(rm.dataset.rm, rm.dataset.v); return; }

  if (e.target.id === 'clrF') { e.preventDefault(); LISTF = ''; renderList(true); }
  const pg = e.target.closest('[data-pg]'); if (pg && !pg.disabled) { PAGE = +pg.dataset.pg; renderList(); document.getElementById('list').scrollIntoView({ block: 'start' }); return; }
});
$('bAdd').onclick = () => openEdit('');
/* ---------- كرت التشغيل من نافذة السائق ---------- */
$('mCardDl').onclick = () => cardDownload(EDIT, $('mCardDl'));
$('mCardUp').onclick = () => { alert(t_('cardUpHow')); $('cardUpFile').click(); };
$('cardUpFile').onchange = async () => {
  const f = $('cardUpFile').files[0], iq = EDIT; if (!f || !iq) return;
  try {
    if (f.size > 5 * 1024 * 1024) throw new Error(t_('cardBig'));
    const b64 = await new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = bad; fr.readAsDataURL(f); });
    $('mCardMsg').textContent = '⏳ ' + t_('saving');
    const j = await NWAuth.call('cardUpload', { iqama: iq, mime: f.type, b64, exp: $('eCard').value });
    if (j.error === 'AUTH') { NWAuth.relogin(); throw new Error(t_('eAuth')); }
    if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? t_('eForb') : j.error === 'BAD_TYPE' ? t_('cardType') : t_('eErr') + j.error);
    CARDS[iq] = 1; $('mCardDl').style.display = ''; $('mCardMsg').textContent = '✅ ' + t_('cardUpDone');
    const r = D.find(x => x[C.IQ] === iq); if (r && $('eCard').value) r[C.CARD] = $('eCard').value;
    render();
  } catch (e) { $('mCardMsg').textContent = ''; alert(e.message); }
  finally { $('cardUpFile').value = ''; }
};

/* ---------- تبديل سائق ---------- */
/* بحث داخل قائمة الاختيار: يكتب جزء من الاسم أو الإقامة أو الرحلة وتطلع الاقتراحات */
function picker(qId, sId, selId) {
  const q = $(qId), box = $(sId), sel = $(selId); let hits = [], act = -1;
  const hide = () => { box.classList.remove('on'); box.innerHTML = ''; hits = []; act = -1; };
  const show = () => {
    const v = q.value.trim().toLowerCase(); if (!v) { hide(); return; }
    hits = [...sel.options].filter(o => o.value && (o.text.toLowerCase().includes(v) || o.value.includes(v))).slice(0, 20);
    if (!hits.length) { box.innerHTML = `<div style="cursor:default;color:var(--muted)">${t_('noMatch')}</div>`; box.classList.add('on'); return; }
    box.innerHTML = hits.map((o, i) => `<div data-pk="${i}">${esc(o.text)}<br><small>${esc(o.value)}</small></div>`).join(''); box.classList.add('on'); act = -1;
  };
  const pick = i => { const o = hits[i]; if (!o) return; sel.value = o.value; q.value = ''; hide(); sel.style.outline = '3px solid #16a34a'; setTimeout(() => sel.style.outline = '', 900); };
  q.addEventListener('input', show); q.addEventListener('focus', show); q.addEventListener('blur', () => setTimeout(hide, 150));
  q.addEventListener('keydown', e => {
    if (!hits.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; [...box.children].forEach((x, i) => x.classList.toggle('act', i === act)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(act < 0 ? 0 : act); }
    else if (e.key === 'Escape') hide();
  });
  box.addEventListener('mousedown', e => { const x = e.target.closest('[data-pk]'); if (x) { e.preventDefault(); pick(+x.dataset.pk); } });
}
picker('swOrigQ', 'swOrigS', 'swOrig'); picker('swRepQ', 'swRepS', 'swRep');
let SW = null;
function openSwapFrom(iq) {           // من سائق الاستعداد/الراحة: يختار الرحلة اللي بيغطيها
  const r = D.find(x => x[C.IQ] === iq); if (!r) return;
  const here = sbDep(r);
  SW = { rep: iq, date: $('fDate').value };
  $('swSub').textContent = `${t_('swRep')}: ${r[C.NAME]} · 📍 ${depName(here)} · ${SW.date}`;
  const on = D.filter(isOnTrip).filter(x => !SWIN[x[C.IQ]])
    .sort((x, y) => (dep(y) === here) - (dep(x) === here) || String(ROSTER[x[C.IQ]]).localeCompare(String(ROSTER[y[C.IQ]])));
  $('swOrig').innerHTML = `<option value="">— ${t_('swPickO')} —</option>` + on.map(x => `<option value="${esc(x[C.IQ])}">🚌 ${esc(ROSTER[x[C.IQ]])} · ${esc(x[C.NAME])} · ${esc(depName(dep(x)))}${dep(x) === here ? ' ✓' : ''}</option>`).join('');
  $('swOrigW').style.display = ''; $('swRepW').style.display = 'none';
  $('swNote').value = ''; $('swReason').value = ''; $('swOrigQ').value = ''; $('swOv').classList.add('on'); setTimeout(() => $('swOrigQ').focus(), 50);
}
function openSwap(iq) {
  const r = D.find(x => x[C.IQ] === iq); if (!r) return;
  const trip = ROSTER[iq], here = dep(r);
  SW = { orig: iq, trip, date: $('fDate').value };
  $('swOrigW').style.display = 'none'; $('swRepW').style.display = '';
  $('swSub').textContent = `${r[C.NAME]} · 🚌 ${trip} · ${SW.date}`;
  const opt = x => { const loc = sbDep(x), l = lastTrip(x); return `<option value="${esc(x[C.IQ])}">${esc(x[C.NAME])} · 📍 ${esc(depName(loc))}${loc === here ? ' ✓' : ''}${l ? ' · ' + esc(l.code) : ''}</option>`; };
  const sort = a => a.sort((x, y) => (sbDep(y) === here) - (sbDep(x) === here) || String(x[C.NAME]).localeCompare(String(y[C.NAME])));
  const sb = sort(D.filter(isStandby)), rs = sort(D.filter(isRest));
  const ex = D.filter(x => isOnTrip(x) && x[C.IQ] !== iq && !SWIN[x[C.IQ]] && ROSTER[x[C.IQ]] !== trip)
    .sort((x, y) => (dep(y) === here) - (dep(x) === here) || String(ROSTER[x[C.IQ]]).localeCompare(String(ROSTER[y[C.IQ]])));
  const optX = x => `<option value="${esc(x[C.IQ])}">🔁 ${esc(ROSTER[x[C.IQ]])} · ${esc(x[C.NAME])} · ${esc(depName(dep(x)))}${dep(x) === here ? ' ✓' : ''}</option>`;
  $('swRep').innerHTML = `<option value="">— ${t_('swPick')} —</option>` + (sb.length ? `<optgroup label="${t_('swG1')} (${sb.length})">${sb.map(opt).join('')}</optgroup>` : '') + (rs.length ? `<optgroup label="${t_('swG2')} (${rs.length})">${rs.map(opt).join('')}</optgroup>` : '') + (ex.length ? `<optgroup label="${t_('swG3')} (${ex.length})">${ex.map(optX).join('')}</optgroup>` : '');
  $('swNote').value = ''; $('swReason').value = ''; $('swRepQ').value = ''; $('swOv').classList.add('on'); setTimeout(() => $('swRepQ').focus(), 50);
}
$('swCancel').onclick = () => { $('swOv').classList.remove('on'); SW = null; };
$('swOv').addEventListener('click', e => { if (e.target.id === 'swOv') $('swOv').classList.remove('on'); });
$('swSave').onclick = async () => {
  if (SW.rep) { const o = $('swOrig').value; if (!o) return alert(t_('swPickO')); SW.orig = o; SW.trip = ROSTER[o]; }
  const rep = SW.rep || $('swRep').value; if (!rep) return alert(t_('swPick'));
  if (!$('swReason').value) { $('swReason').focus(); return alert(t_('swNeedR')); }
  if ($('swNote').value.trim().length < 3) { $('swNote').focus(); return alert(t_('swNeedN')); }
  const b = $('swSave'); b.disabled = true;
  try {
    const exchange = !!ROSTER[rep];
    if (exchange) { const a = D.find(x => x[C.IQ] === SW.orig), bb = D.find(x => x[C.IQ] === rep);
      if (!confirm(t_('xAsk')(a ? a[C.NAME] : SW.orig, SW.trip, bb ? bb[C.NAME] : rep, ROSTER[rep]))) return; }
    const j = await NWAuth.call('driverSwap', { swap: { date: SW.date, trip: SW.trip, orig: SW.orig, rep, reason: $('swReason').value, note: $('swNote').value, exchange } });
    if (j.error === 'AUTH') { NWAuth.relogin(); throw new Error(t_('eAuth')); }
    if (!j.ok) throw new Error({ FORBIDDEN: t_('eForb'), REP_BUSY: t_('swBusy'), SAME_TRIP: t_('swSame2'), NEED_REASON: t_('swNeedN'), NOT_IN_ROSTER: t_('swNotIn') }[j.error] || t_('eErr') + j.error);
    $('swOv').classList.remove('on'); SW = null; await loadRoster(); render(); alert(t_('swDone'));
  } catch (e) { alert(e.message); } finally { b.disabled = false; }
};
async function dayMark(iq, mark) {
  const r = D.find(x => x[C.IQ] === iq), date = $('fDate').value;
  if (!confirm((mark ? t_('toRestAsk') : t_('toSbAsk'))(r ? r[C.NAME] : iq, date))) return;
  try {
    const j = await NWAuth.call('dayMark', { date, iqama: iq, mark });
    if (j.error === 'AUTH') { NWAuth.relogin(); throw new Error(t_('eAuth')); }
    if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? t_('eForb') : t_('eErr') + j.error);
    if (mark) RESTM[iq] = { date, iqama: iq, mark }; else delete RESTM[iq];
    render();
  } catch (e) { alert(e.message); }
}
async function unswap(iq) {
  const x = SWIN[iq]; if (!x || !confirm(t_('unswAsk'))) return;
  try {
    const pair = isX(iq) ? SWOUT[iq] : null;   // تبادل: يلغي الطرفين
    const j = await NWAuth.call('swapCancel', { swap: pair ? { date: x.date, trip: x.trip, rep: x.rep, orig: x.orig, pairTrip: pair.trip } : { date: x.date, trip: x.trip, rep: x.rep } });
    if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? t_('eForb') : t_('eErr') + j.error);
    await loadRoster(); render();
  } catch (e) { alert(e.message); }
}
$('bRefresh').onclick = load;
$('fDepot').onchange = () => { PAGE = 1; render(); };
$('fDate').onchange = async () => { await loadRoster(); render(); };
['fStatus', 'fNat'].forEach(id => $(id).addEventListener('input', () => renderList(true)));
/* بحث بالاقتراحات (نفس طريقة باقي البرامج) */
let SUG = [], SUGI = -1;
function sugHide() { $('qSug').classList.remove('on'); $('qSug').innerHTML = ''; SUG = []; SUGI = -1; }
function sugShow() {
  const q = $('q').value.trim().toLowerCase(); if (!q) { sugHide(); return; }
  SUG = filtered($('fDepot').value).filter(r => [r[C.NAME], r[C.IQ], r[C.EMP], r[C.MOB], ROSTER[r[C.IQ]] || ''].join(' ').toLowerCase().includes(q)).slice(0, 15);
  if (!SUG.length) { sugHide(); return; }
  $('qSug').innerHTML = SUG.map((r, i) => `<div data-sg="${i}"><b>${esc(r[C.NAME])}</b><small>${esc(r[C.IQ])} · ${esc(depName(r[C.DEP]))} · ${esc(stName(r[C.ST]))}${ROSTER[r[C.IQ]] ? ' · 🚌 ' + esc(ROSTER[r[C.IQ]]) : isRest(r) ? ' · 😴 ' + t_('rest') : isStandby(r) ? ' · ' + t_('standby') : ''}</small></div>`).join('');
  $('qSug').classList.add('on'); SUGI = -1;

      const dv = $('fDepot').value; LAST_RES = { from, to, res, scope: dv ? (dv === '*mine' ? (MINE || []).map(depName).join('، ') : depName(dv)) : 'كل الكراجات' };
      if (!Object.keys(data.days).some(k => k >= from && k <= to && (data.days[k] || []).length)) $('rpOut').innerHTML = '<div class="msg err">لا يوجد روستر مرفوع في هذي الفترة</div>';
      else if (list.length === 1) showOne(res[0], false); else showAll(res);
    } catch (e) { $('rpOut').innerHTML = `<div class="msg err">${esc(e.message || t_('eNet'))}</div>`; }
    finally { b.disabled = false; }
  };
})();
</script>
</body>
